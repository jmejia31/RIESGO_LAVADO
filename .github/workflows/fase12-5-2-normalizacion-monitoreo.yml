name: Fase 12.5.2 Normalización Monitoreo de Listas

on:
  pull_request:
    branches: [fase-12-mejora-ejecutiva-matrices]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fase12-5-2-monitoreo
  cancel-in-progress: false

jobs:
  normalizar-validar-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout rama objetivo
        uses: actions/checkout@v4
        with:
          ref: fase-12-mejora-ejecutiva-matrices
          fetch-depth: 0

      - name: Aplicar normalización de reportería
        run: python tools/fase12_5_2_normalizar_monitoreo.py

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/rl-app/package-lock.json

      - name: Instalar ExcelJS y actualizar lockfile
        working-directory: frontend/rl-app
        run: npm install exceljs@4.4.0 --save

      - name: Restore backend
        run: dotnet restore RIESGO_LAVADO.sln

      - name: Instalar Playwright Chromium
        working-directory: frontend/rl-app
        run: npx playwright install --with-deps chromium

      - name: Verificar reglas documentales
        shell: bash
        run: |
          grep -q 'exceljs' frontend/rl-app/package.json
          grep -q "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" frontend/rl-app/src/app/core/utils/excel-export.util.ts
          ! grep -q "replace(/\\.xlsx\$/i, '.xls')" frontend/rl-app/src/app/core/utils/excel-export.util.ts
          grep -q "rowPageBreak: 'avoid'" frontend/rl-app/src/app/core/reporting/institutional-report.util.ts
          grep -q "showHead: 'everyPage'" frontend/rl-app/src/app/core/reporting/institutional-report.util.ts
          grep -q "Página.*de" frontend/rl-app/src/app/core/reporting/institutional-report.util.ts
          test "$(grep -c 'autoTableInstitucional(doc, {' frontend/rl-app/src/app/features/admin/listas/pages/monitoreo-listas/monitoreo-listas.component.ts)" -ge 5

      - name: Ejecutar Quality Gates completos
        id: quality
        continue-on-error: true
        shell: pwsh
        run: ./tools/run_quality_gates.ps1 *> fase12_5_2_quality.log

      - name: Publicar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase12-5-2-diagnostico
          path: |
            fase12_5_2_quality.log
            docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor/Evidencia_Fase_12_5_2/fase12_5_2_normalizacion_monitoreo.json
          if-no-files-found: error

      - name: Detener si Quality Gates fallaron
        if: steps.quality.outcome != 'success'
        run: exit 1

      - name: Registrar validación aprobada
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor/Evidencia_Fase_12_5_2/fase12_5_2_normalizacion_monitoreo.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['estado'] = 'validado_ci'
          data['quality_gates'] = {
              'backend': 'aprobado',
              'frontend': 'aprobado',
              'build_angular': 'aprobado',
              'e2e': 'aprobado'
          }
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Publicar commit limpio
        shell: bash
        run: |
          rm -f fase12_5_2_quality.log
          rm -f tools/fase12_5_2_normalizar_monitoreo.py
          rm -f .github/workflows/fase12-5-2-normalizacion-monitoreo.yml
          rm -f "docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor/Evidencia_Fase_12_5_2/ACTIVAR"*.tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(reporteria): normaliza Monitoreo de Listas fase 12.5.2"
          git pull --rebase origin fase-12-mejora-ejecutiva-matrices
          git push origin HEAD:fase-12-mejora-ejecutiva-matrices

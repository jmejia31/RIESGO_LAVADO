name: Corrección global de reportería Excel y PDF

on:
  pull_request:
    branches: [fase-12-mejora-ejecutiva-matrices]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: fix-reporteria-regresiones-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  corregir-validar-publicar:
    if: github.event.pull_request.head.ref == 'fix-reporteria-estandar-global-20260723'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      REPORTERIA_REGRESION_OUTPUT_DIR: ${{ github.workspace }}/artifacts/reporteria
      FASE12_5_5_OUTPUT_DIR: ${{ github.workspace }}/artifacts/reporteria

    steps:
      - name: Checkout de la rama técnica
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Robustecer anclajes del integrador
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/fix_reporteria_regresiones.py')
          s = p.read_text(encoding='utf-8')

          inicio = s.index('# 1) Corrige el orden OpenXML exigido por Excel Desktop.')
          fin = s.index('# 2) Espaciado institucional uniforme', inicio)
          bloque_openxml = r'''# 1) Corrige el orden OpenXML exigido por Excel Desktop.
          text = xlsx_backend.read_text(encoding='utf-8')
          lines = text.splitlines()

          def unique_index(marker: str) -> int:
              matches = [index for index, line in enumerate(lines) if marker in line]
              if len(matches) != 1:
                  raise RuntimeError(f'Se esperó una línea para {marker}, encontradas: {len(matches)}.')
              return matches[0]

          sheet_pr_index = unique_index('<sheetPr><pageSetUpPr')
          lines.insert(sheet_pr_index + 1, r'               $"<dimension ref=\"A1:{lastColumn}{lastRow}\"/>" +')
          sheet_views_index = unique_index('<sheetViews><sheetView')
          lines.insert(sheet_views_index + 1, r'               "<sheetFormatPr defaultRowHeight=\"18\"/>" +')

          merge_index = unique_index('<mergeCells count=')
          filter_index = unique_index('<autoFilter ref=')
          merge_line = lines.pop(merge_index)
          if merge_index < filter_index:
              filter_index -= 1
          filter_line = lines.pop(filter_index)
          insert_at = min(merge_index, filter_index)
          lines[insert_at:insert_at] = [filter_line, merge_line]
          xlsx_backend.write_text('\n'.join(lines) + ('\n' if text.endswith('\n') else ''), encoding='utf-8')

          '''
          s = s[:inicio] + bloque_openxml + s[fin:]

          inicio = s.index('# 5) Fortalece la prueba backend')
          bloque_prueba = r'''# 5) Fortalece la prueba backend con validación del orden de nodos OpenXML.
          text = renderer_tests.read_text(encoding='utf-8')
          if 'using System.Xml.Linq;' not in text:
              text = text.replace('using System.Text.Json;\n', 'using System.Text.Json;\nusing System.Xml.Linq;\n', 1)

          lines = text.splitlines()
          anchors = [index for index, line in enumerate(lines) if 'Assert.Contains("fitToWidth=' in line]
          if len(anchors) != 1:
              raise RuntimeError(f'Se esperaba un anclaje fitToWidth en la prueba backend, encontrados: {len(anchors)}.')

          insert_at = anchors[0] + 1
          validation = [
              '',
              '            var document = XDocument.Parse(sheetXml);',
              '            var children = document.Root!.Elements().Select(element => element.Name.LocalName).ToList();',
              '            var autoFilterIndex = children.IndexOf("autoFilter");',
              '            var mergeCellsIndex = children.IndexOf("mergeCells");',
              '            Assert.True(autoFilterIndex >= 0, $"{worksheet.FullName} no contiene autoFilter.");',
              '            Assert.True(mergeCellsIndex >= 0, $"{worksheet.FullName} no contiene mergeCells.");',
              '            Assert.True(autoFilterIndex < mergeCellsIndex,',
              '                $"{worksheet.FullName} no respeta el orden OpenXML: autoFilter debe preceder a mergeCells.");',
              '            Assert.NotEmpty(document.Root.Descendants().Where(element => element.Name.LocalName == "row"));'
          ]
          lines[insert_at:insert_at] = validation
          renderer_tests.write_text('\n'.join(lines) + ('\n' if text.endswith('\n') else ''), encoding='utf-8')

          print('Correcciones de reportería aplicadas.')
          '''
          s = s[:inicio] + bloque_prueba
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile tools/fix_reporteria_regresiones.py

      - name: Aplicar correcciones institucionales
        id: transformar
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts/diagnostico
          set +e
          python tools/fix_reporteria_regresiones.py > artifacts/diagnostico/transformacion.log 2>&1
          codigo=$?
          cat artifacts/diagnostico/transformacion.log
          exit $codigo

      - name: Publicar diagnóstico del transformador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporteria-transformacion-diagnostico
          path: artifacts/diagnostico/
          if-no-files-found: error
          retention-days: 7

      - name: Detener si la transformación falló
        if: steps.transformar.outcome == 'failure'
        run: exit 1

      - name: Compatibilizar artefactos de prueba con Angular
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          archivos = [
              Path('frontend/rl-app/src/app/core/reporting/institutional-report.util.spec.ts'),
              Path('frontend/rl-app/src/app/core/utils/excel-export.util.spec.ts')
          ]
          for path in archivos:
              text = path.read_text(encoding='utf-8')
              text = text.replace("import { mkdirSync, writeFileSync } from 'node:fs';", "// @ts-ignore: Vitest ejecuta este archivo en Node.js.\nimport { mkdirSync, writeFileSync } from 'node:fs';")
              text = text.replace("import { resolve } from 'node:path';", "// @ts-ignore: Vitest ejecuta este archivo en Node.js.\nimport { resolve } from 'node:path';")
              text = text.replace("process.env['REPORTERIA_REGRESION_OUTPUT_DIR']", "(globalThis as any).process?.env?.['REPORTERIA_REGRESION_OUTPUT_DIR']")
              text = text.replace("Buffer.from(doc.output('arraybuffer'))", "new Uint8Array(doc.output('arraybuffer'))")
              text = text.replace("Buffer.from(buffer)", "new Uint8Array(buffer as ArrayBuffer)")
              path.write_text(text, encoding='utf-8')
          PY

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/rl-app/package-lock.json

      - name: Restaurar backend
        run: dotnet restore RIESGO_LAVADO.sln

      - name: Instalar frontend
        working-directory: frontend/rl-app
        run: npm ci

      - name: Instalar Chromium para E2E
        working-directory: frontend/rl-app
        run: npx playwright install --with-deps chromium

      - name: Ejecutar Quality Gates completos
        id: quality
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/diagnostico | Out-Null
          ./tools/run_quality_gates.ps1 *>&1 | Tee-Object -FilePath artifacts/diagnostico/quality-gates.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publicar diagnóstico de Quality Gates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporteria-quality-gates-diagnostico
          path: artifacts/diagnostico/quality-gates.log
          if-no-files-found: warn
          retention-days: 7

      - name: Detener si los Quality Gates fallaron
        if: steps.quality.outcome == 'failure'
        run: exit 1

      - name: Confirmar artefactos reales de regresión
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/reporteria/reporte_matrices.xlsx
          test -s artifacts/reporteria/reporte_ejecutivo_matrices.pdf
          test -s artifacts/reporteria/monitoreo_juridicas_estandar.xlsx
          test -s artifacts/reporteria/monitoreo_ficha_natural_estandar.xlsx
          test -s artifacts/reporteria/monitoreo_detalle_continuacion.pdf
          find artifacts/reporteria -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Publicar artefactos para revisión visual
        uses: actions/upload-artifact@v4
        with:
          name: reporteria-regresion-validada
          path: artifacts/reporteria/
          if-no-files-found: error
          retention-days: 14

      - name: Retirar automatización temporal
        run: |
          rm -f tools/fix_reporteria_regresiones.py
          rm -f .github/workflows/fix-reporteria-regresiones.yml

      - name: Publicar commit limpio en la rama técnica
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios para publicar."
            exit 0
          fi
          git commit -m "fix(reporteria): corrige Excel y paginación PDF global"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

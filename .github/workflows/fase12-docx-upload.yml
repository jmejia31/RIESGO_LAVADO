name: Incorporar documento maestro Fase 12

on:
  pull_request:
    branches: [fase-12-mejora-ejecutiva-matrices]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fase12-documento-maestro
  cancel-in-progress: false

jobs:
  generar-y-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout rama objetivo
        uses: actions/checkout@v4
        with:
          ref: fase-12-mejora-ejecutiva-matrices
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencia DOCX
        run: python -m pip install --disable-pip-version-check python-docx

      - name: Reconstruir generador
        shell: bash
        run: |
          cat tools/fase12_docx_upload/script00.txt \
              tools/fase12_docx_upload/script01.txt \
              tools/fase12_docx_upload/script02.txt \
              tools/fase12_docx_upload/script03.txt > /tmp/create_fase12_closure.py
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/create_fase12_closure.py')
          text = p.read_text(encoding='utf-8')
          source = "OUT = Path('/mnt/data/Cierre_Tecnico_Fase_12_Matrices_Riesgos_SGRLA_IHSS.docx')"
          target = "OUT = Path(r'docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor/Cierre_Tecnico_Fase_12_Matrices_Riesgos_SGRLA_IHSS.docx')"
          if source not in text:
              raise SystemExit('No se encontró la ruta de salida esperada en el generador.')
          p.write_text(text.replace(source, target, 1), encoding='utf-8')
          PY

      - name: Generar documento maestro
        run: |
          mkdir -p "docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor"
          python /tmp/create_fase12_closure.py

      - name: Validar integridad y checksum
        shell: bash
        run: |
          DOC="docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor/Cierre_Tecnico_Fase_12_Matrices_Riesgos_SGRLA_IHSS.docx"
          test -s "$DOC"
          test "$(stat -c%s "$DOC")" -gt 40000
          python -m zipfile -t "$DOC"
          unzip -l "$DOC" | grep -q 'word/document.xml'
          sha256sum "$DOC" > "${DOC%.docx}.sha256"
          cat "${DOC%.docx}.sha256"

      - name: Registrar nota para revisión Codex
        shell: bash
        run: |
          cat > "docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor/REVISION_DOCUMENTO_MAESTRO_FASE_12.md" <<'EOF'
          # Revisión del documento maestro de cierre — Fase 12

          Documento a revisar:

          `Cierre_Tecnico_Fase_12_Matrices_Riesgos_SGRLA_IHSS.docx`

          Validaciones solicitadas a Codex:

          - Confirmar que el documento abre correctamente en Microsoft Word.
          - Revisar portada, encabezados, pies de página, tablas, mapa de calor y sección de aprobación.
          - Confirmar coherencia con los commits y Quality Gates registrados en la rama.
          - Verificar que no existan páginas cortadas, tablas desbordadas ni textos superpuestos.
          - No realizar merge a `main` durante la revisión.
          EOF

      - name: Publicar commit limpio
        shell: bash
        run: |
          rm -rf tools/fase12_docx_upload
          rm -f .github/workflows/fase12-docx-upload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(matrices): incorpora documento maestro de cierre fase 12"
          git pull --rebase origin fase-12-mejora-ejecutiva-matrices
          git push origin HEAD:fase-12-mejora-ejecutiva-matrices

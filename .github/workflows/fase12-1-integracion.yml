name: Fase 12.1 Validacion

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fase12-1-validacion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout rama
        uses: actions/checkout@v4
        with:
          ref: fase-12-mejora-ejecutiva-matrices
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/rl-app/package-lock.json

      - name: Verificar integración Fase 12.1
        shell: bash
        run: |
          componente="frontend/rl-app/src/app/features/admin/matrices-riesgos/pages/matrices-riesgos/matrices-riesgos.component.ts"
          plantilla="frontend/rl-app/src/app/features/admin/matrices-riesgos/pages/matrices-riesgos/matrices-riesgos.component.html"
          grep -q "matrices-riesgos-estados.policy" "$componente"
          ! grep -q '(click)="calcularMatriz(matriz)"' "$plantilla"
          grep -q '>Evaluadas</p>' "$plantilla"
          grep -q '!puedeEditarMatriz(matriz)' "$plantilla"
          grep -q '!puedeEliminarMatriz(matriz)' "$plantilla"

      - name: Instalar dependencias frontend
        working-directory: frontend/rl-app
        run: npm ci

      - name: Ejecutar pruebas frontend
        id: frontend_tests
        working-directory: frontend/rl-app
        shell: bash
        run: |
          set +e
          npm run test:coverage > ../../../../fase12_1_frontend_tests.txt 2>&1
          codigo=$?
          echo "exit_code=$codigo" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Ejecutar build Angular
        id: angular_build
        working-directory: frontend/rl-app
        shell: bash
        run: |
          set +e
          npm run build > ../../../../fase12_1_angular_build.txt 2>&1
          codigo=$?
          echo "exit_code=$codigo" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generar resultado JSON
        shell: python
        env:
          TEST_EXIT_CODE: ${{ steps.frontend_tests.outputs.exit_code }}
          BUILD_EXIT_CODE: ${{ steps.angular_build.outputs.exit_code }}
        run: |
          import json
          import os
          from datetime import datetime, timezone

          tests_ok = os.environ.get('TEST_EXIT_CODE') == '0'
          build_ok = os.environ.get('BUILD_EXIT_CODE') == '0'
          resultado = {
              'fase': '12.1 - Orden funcional y reglas',
              'fecha': datetime.now(timezone.utc).isoformat(),
              'rama': 'fase-12-mejora-ejecutiva-matrices',
              'integracion_politica_estados': True,
              'boton_calcular_manual_retirado': True,
              'kpi_estado_tecnico_retirado': True,
              'pruebas_frontend': 'Aprobadas' if tests_ok else 'Fallidas',
              'build_angular': 'Aprobado' if build_ok else 'Fallido',
              'resultado': 'Correcto' if tests_ok and build_ok else 'Requiere correccion',
              'exit_code_pruebas': int(os.environ.get('TEST_EXIT_CODE', '-1')),
              'exit_code_build': int(os.environ.get('BUILD_EXIT_CODE', '-1')),
          }
          with open('fase12_1_validacion_integracion.json', 'w', encoding='utf-8') as archivo:
              json.dump(resultado, archivo, ensure_ascii=False, indent=2)

      - name: Empaquetar código integrado
        shell: bash
        run: |
          mkdir -p fase12_1_codigo
          cp frontend/rl-app/src/app/features/admin/matrices-riesgos/domain/matrices-riesgos-estados.policy.ts fase12_1_codigo/
          cp frontend/rl-app/src/app/features/admin/matrices-riesgos/domain/matrices-riesgos-estados.policy.spec.ts fase12_1_codigo/
          cp frontend/rl-app/src/app/features/admin/matrices-riesgos/pages/matrices-riesgos/matrices-riesgos.component.ts fase12_1_codigo/
          cp frontend/rl-app/src/app/features/admin/matrices-riesgos/pages/matrices-riesgos/matrices-riesgos.component.html fase12_1_codigo/

      - name: Publicar artefacto de diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: fase12-1-validacion-${{ github.run_id }}
          path: |
            fase12_1_validacion_integracion.json
            fase12_1_frontend_tests.txt
            fase12_1_angular_build.txt
            fase12_1_codigo/
          if-no-files-found: error
          retention-days: 7

      - name: Validar resultado final
        shell: bash
        run: |
          cat fase12_1_validacion_integracion.json
          if [ "${{ steps.frontend_tests.outputs.exit_code }}" != "0" ] || [ "${{ steps.angular_build.outputs.exit_code }}" != "0" ]; then
            exit 1
          fi

name: Fase 12.1 Integracion

on:
  push:
    branches:
      - fase-12-mejora-ejecutiva-matrices
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fase12-1-integracion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout rama
        uses: actions/checkout@v4
        with:
          ref: fase-12-mejora-ejecutiva-matrices
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/rl-app/package-lock.json

      - name: Aplicar integracion Fase 12.1
        run: node tools/fase12_1_integrar_reglas.mjs

      - name: Instalar dependencias frontend
        working-directory: frontend/rl-app
        run: npm ci

      - name: Pruebas frontend con diagnostico
        id: frontend_tests
        working-directory: frontend/rl-app
        shell: bash
        run: |
          set +e
          npm run test:coverage 2>&1 | tee /tmp/fase12_1_frontend_tests.log
          codigo=${PIPESTATUS[0]}
          echo "exit_code=$codigo" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build Angular con diagnostico
        id: angular_build
        working-directory: frontend/rl-app
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/fase12_1_angular_build.log
          codigo=${PIPESTATUS[0]}
          echo "exit_code=$codigo" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Guardar diagnostico y evidencia
        shell: pwsh
        run: |
          $base = "docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor/Evidencia_Fase_12_1"
          $testsSalida = Get-Content "/tmp/fase12_1_frontend_tests.log" -Raw
          $buildSalida = Get-Content "/tmp/fase12_1_angular_build.log" -Raw
          $testsSalida | Set-Content -Path "$base/fase12_1_frontend_tests.log" -Encoding UTF8
          $buildSalida | Set-Content -Path "$base/fase12_1_angular_build.log" -Encoding UTF8

          $testsOk = "${{ steps.frontend_tests.outputs.exit_code }}" -eq "0"
          $buildOk = "${{ steps.angular_build.outputs.exit_code }}" -eq "0"
          if ($testsOk) { $estadoTests = "Aprobadas" } else { $estadoTests = "Fallidas" }
          if ($buildOk) { $estadoBuild = "Aprobado" } else { $estadoBuild = "Fallido" }
          if ($testsOk -and $buildOk) { $resultado = "Correcto" } else { $resultado = "Requiere correccion" }

          $obj = [ordered]@{
            fase = "12.1 - Orden funcional y reglas"
            fecha = (Get-Date).ToString("yyyy-MM-ddTHH:mm:ssK")
            rama = "fase-12-mejora-ejecutiva-matrices"
            integracion_politica_estados = $true
            boton_calcular_manual_retirado = $true
            kpi_estado_tecnico_retirado = $true
            pruebas_frontend = $estadoTests
            build_angular = $estadoBuild
            resultado = $resultado
          }
          $obj | ConvertTo-Json -Depth 5 | Set-Content -Path "$base/fase12_1_validacion_integracion.json" -Encoding UTF8

      - name: Publicar integracion atomica por API GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: fase-12-mejora-ejecutiva-matrices
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ['REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          branch = os.environ['TARGET_BRANCH']
          api = 'https://api.github.com'

          def request(method, endpoint, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  f'{api}{endpoint}',
                  data=data,
                  method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      return json.loads(response.read().decode('utf-8'))
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  raise RuntimeError(f'GitHub API {method} {endpoint}: {exc.code} {body}') from exc

          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          untracked = subprocess.check_output(
              ['git', 'ls-files', '--others', '--exclude-standard'], text=True
          ).splitlines()
          prefixes = (
              'frontend/rl-app/src/app/features/admin/matrices-riesgos/',
              'docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor/Evidencia_Fase_12_1/',
          )
          files = sorted({path for path in changed + untracked if path.startswith(prefixes)})
          if not files:
              print('No hay archivos de integración pendientes.')
              raise SystemExit(0)

          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          commit_data = request('GET', f'/repos/{repo}/git/commits/{parent}')
          base_tree = commit_data['tree']['sha']

          tree_entries = []
          for file_path in files:
              with open(file_path, 'rb') as handle:
                  encoded = base64.b64encode(handle.read()).decode('ascii')
              blob = request('POST', f'/repos/{repo}/git/blobs', {
                  'content': encoded,
                  'encoding': 'base64',
              })
              tree_entries.append({
                  'path': file_path,
                  'mode': '100644',
                  'type': 'blob',
                  'sha': blob['sha'],
              })

          tree = request('POST', f'/repos/{repo}/git/trees', {
              'base_tree': base_tree,
              'tree': tree_entries,
          })
          new_commit = request('POST', f'/repos/{repo}/git/commits', {
              'message': 'feat(matrices): integra reglas operativas fase 12.1',
              'tree': tree['sha'],
              'parents': [parent],
          })
          encoded_branch = urllib.parse.quote(branch, safe='')
          request('PATCH', f'/repos/{repo}/git/refs/heads/{encoded_branch}', {
              'sha': new_commit['sha'],
              'force': False,
          })
          print(f"Commit publicado: {new_commit['sha']}")
          PY

      - name: Validar resultado final
        shell: bash
        run: |
          if [ "${{ steps.frontend_tests.outputs.exit_code }}" != "0" ] || [ "${{ steps.angular_build.outputs.exit_code }}" != "0" ]; then
            echo "La integración requiere corrección. Revise la evidencia versionada."
            exit 1
          fi

name: Fase 12.5.5 Maquetación Final

on:
  pull_request:
    branches: [fase-12-mejora-ejecutiva-matrices]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fase12-5-5-maquetacion-final
  cancel-in-progress: false

jobs:
  maquetar-validar-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout rama de maquetación
        uses: actions/checkout@v4
        with:
          ref: fase-12-5-5-maquetacion-final
          fetch-depth: 0

      - name: Instalar herramientas documentales
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer libreoffice-calc poppler-utils
          python -m pip install --upgrade pip
          python -m pip install python-docx

      - name: Aplicar maquetación definitiva
        run: python tools/fase12_5_5_maquetacion_final.py "${GITHUB_RUN_ID}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/rl-app/package-lock.json

      - name: Restore backend
        run: dotnet restore RIESGO_LAVADO.sln

      - name: Instalar frontend
        working-directory: frontend/rl-app
        run: npm ci

      - name: Instalar Playwright Chromium
        working-directory: frontend/rl-app
        run: npx playwright install --with-deps chromium

      - name: Generar archivos oficiales reales
        shell: bash
        run: |
          mkdir -p artifacts/reportes
          FASE12_5_5_OUTPUT_DIR="$PWD/artifacts/reportes" \
            dotnet test backend/RL.API.Tests/RL.API.Tests.csproj \
            --configuration Release \
            --no-restore \
            --filter FullyQualifiedName~MatricesRiesgosReportRendererTests \
            --logger "console;verbosity=normal" | tee artifacts/renderer_tests.log

      - name: Ejecutar Quality Gates completos
        shell: pwsh
        run: |
          ./tools/run_quality_gates.ps1 *> artifacts/fase12_5_5_maquetacion_quality.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compilar Angular para producción
        working-directory: frontend/rl-app
        shell: bash
        run: npm run build 2>&1 | tee ../../artifacts/frontend_build.log

      - name: Actualizar checksum y evidencia
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          base = Path('docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor')
          docx = base / 'Cierre_Tecnico_Fase_12_Matrices_Riesgos_SGRLA_IHSS.docx'
          checksum = hashlib.sha256(docx.read_bytes()).hexdigest()
          (base / 'Cierre_Tecnico_Fase_12_Matrices_Riesgos_SGRLA_IHSS.sha256').write_text(
              f'{checksum}  {docx.name}\n', encoding='utf-8')
          evidence_path = base / 'Evidencia_Fase_12_5_5/fase12_5_5_cierre_definitivo.json'
          data = json.loads(evidence_path.read_text(encoding='utf-8'))
          data['documento_maestro']['tamano_bytes'] = docx.stat().st_size
          data['documento_maestro']['sha256'] = checksum
          data['maquetacion_final']['run_id'] = int(os.environ['GITHUB_RUN_ID'])
          evidence_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Renderizar paquete definitivo
        shell: bash
        run: |
          DOC_DIR="docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor"
          DOCX="$DOC_DIR/Cierre_Tecnico_Fase_12_Matrices_Riesgos_SGRLA_IHSS.docx"
          mkdir -p artifacts/render_docx artifacts/render_reporte_pdf artifacts/render_ficha_pdf artifacts/render_xlsx

          libreoffice --headless --convert-to pdf --outdir artifacts/render_docx "$DOCX"
          pdftoppm -png -r 150 artifacts/render_docx/Cierre_Tecnico_Fase_12_Matrices_Riesgos_SGRLA_IHSS.pdf artifacts/render_docx/page
          pdftoppm -png -r 150 artifacts/reportes/reporte_ejecutivo_matrices.pdf artifacts/render_reporte_pdf/page
          pdftoppm -png -r 150 artifacts/reportes/ficha_individual_matriz.pdf artifacts/render_ficha_pdf/page
          libreoffice --headless --convert-to pdf --outdir artifacts/render_xlsx artifacts/reportes/reporte_matrices.xlsx
          pdftoppm -png -r 150 artifacts/render_xlsx/reporte_matrices.pdf artifacts/render_xlsx/page

          test "$(find artifacts/render_docx -name 'page-*.png' | wc -l)" -gt 0
          test "$(find artifacts/render_reporte_pdf -name 'page-*.png' | wc -l)" -eq 2
          test "$(find artifacts/render_ficha_pdf -name 'page-*.png' | wc -l)" -eq 1
          test "$(find artifacts/render_xlsx -name 'page-*.png' | wc -l)" -eq 6

      - name: Registrar paquete pendiente de inspección
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          base = Path('docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor')
          evidence_path = base / 'Evidencia_Fase_12_5_5/fase12_5_5_cierre_definitivo.json'
          data = json.loads(evidence_path.read_text(encoding='utf-8'))
          data['render_visual_generado'] = {
              'documento_maestro_paginas': len(list(Path('artifacts/render_docx').glob('page-*.png'))),
              'reporte_ejecutivo_paginas': 2,
              'ficha_individual_paginas': 1,
              'xlsx_paginas_renderizadas': 6,
              'revision_visual_manual': 'pendiente_revision_asistente'
          }
          data['estado'] = 'maquetacion_final_generada_pendiente_revision_visual_manual'
          evidence_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Publicar paquete definitivo
        uses: actions/upload-artifact@v4
        with:
          name: fase12-5-5-maquetacion-final
          path: |
            artifacts/
            docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor/Cierre_Tecnico_Fase_12_Matrices_Riesgos_SGRLA_IHSS.docx
            docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor/Cierre_Tecnico_Fase_12_Matrices_Riesgos_SGRLA_IHSS.sha256
            docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor/Evidencia_Fase_12_5_5/fase12_5_5_cierre_definitivo.json
          if-no-files-found: error

      - name: Publicar commit limpio
        shell: bash
        run: |
          rm -rf artifacts
          rm -f tools/fase12_5_5_maquetacion_final.py
          rm -f .github/workflows/fase12-5-5-maquetacion-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(matrices): finaliza maquetación documental fase 12.5.5"
          git pull --rebase origin fase-12-mejora-ejecutiva-matrices
          git push origin HEAD:fase-12-mejora-ejecutiva-matrices

name: Corrección controlada de paridad Excel PDF

on:
  pull_request:
    branches: [fase-12-mejora-ejecutiva-matrices]
    paths:
      - .github/parity-fix-trigger.txt

permissions:
  contents: write

concurrency:
  group: temporary-monitoreo-excel-parity
  cancel-in-progress: false

jobs:
  patch-validate-publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout rama obligatoria
        uses: actions/checkout@v4
        with:
          ref: fase-12-mejora-ejecutiva-matrices
          fetch-depth: 0

      - name: Aplicar corrección mínima y regresión
        shell: python
        run: |
          from pathlib import Path

          component_path = Path('frontend/rl-app/src/app/features/admin/listas/pages/monitoreo-listas/monitoreo-listas.component.ts')
          spec_path = Path('frontend/rl-app/src/app/features/admin/listas/pages/monitoreo-listas/monitoreo-listas.component.spec.ts')

          component = component_path.read_text(encoding='utf-8')
          start_marker = '  exportarListaPrincipal() {'
          end_marker = '  private obtenerResumenFiltrosPrincipales(): string {'
          start = component.index(start_marker)
          end = component.index(end_marker, start)

          replacement = '''  exportarListaPrincipal() {
            const tipo = this.tipoActivo();
            const reporte = this.construirReporteListaPrincipal();
            if (!reporte) return;

            const dataExcel = [
              [reporte.title],
              [this.configService.configSistema()?.nombreInstitucion || 'Instituto Hondureño de Seguridad Social'],
              [`Fecha de Generación: ${this.formatDate(new Date().toISOString())}`],
              [],
              reporte.headers,
              ...reporte.rows
            ];

            const ws = XLSX.utils.aoa_to_sheet(dataExcel);

            // Auto-ajustar ancho de columnas
            const maxLens = dataExcel.reduce((acc, row) => {
              row.forEach((val, colIdx) => {
                const len = val ? val.toString().length : 0;
                if (!acc[colIdx] || len > acc[colIdx]) {
                  acc[colIdx] = len;
                }
              });
              return acc;
            }, [] as number[]);
            ws['!cols'] = maxLens.map(len => ({ wch: Math.min(Math.max(len + 2, 10), 40) }));

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Coincidencias');

            const fileName = `Reporte_${tipo.charAt(0).toUpperCase() + tipo.slice(1)}s_${new Date().toISOString().split('T')[0]}.xlsx`;
            this.listasService.registrarAuditoriaExportacion(
              'RL_LISTA_POSITIVOS',
              tipo,
              'ExportacionMonitoreoListas',
              {
                accion: 'EXPORTACION_EXCEL',
                tipo,
                titulo: reporte.title,
                cantidadRegistros: reporte.rows.length,
                archivo: fileName
              }
            ).subscribe({
              next: () => XLSX.writeFile(wb, fileName),
              error: err => this.manejarErrorAuditoriaObligatoria(err, 'exportación Excel')
            });
          }

'''

          component = component[:start] + replacement + component[end:]
          component = component.replace(
              'private construirReporteListaPrincipalPdf(): { title: string; headers: string[]; rows: string[][] } | null {',
              'private construirReporteListaPrincipal(): { title: string; headers: string[]; rows: string[][] } | null {'
          )
          component = component.replace(
              'const reporte = this.construirReporteListaPrincipalPdf();',
              'const reporte = this.construirReporteListaPrincipal();'
          )

          if 'construirReporteListaPrincipalPdf' in component:
              raise SystemExit('Quedó una referencia al constructor exclusivo de PDF.')
          if "headers = ['Número Patronal', 'RTN'" in component:
              raise SystemExit('La exportación Excel aún conserva el constructor duplicado anterior.')
          if component.count('construirReporteListaPrincipal()') != 3:
              raise SystemExit('El modelo compartido no quedó conectado exactamente a Excel, definición y PDF.')

          component_path.write_text(component, encoding='utf-8')

          spec = spec_path.read_text(encoding='utf-8')
          marker = "  it('cancela la exportacion principal si no puede registrar la auditoria', async () => {"
          regression = '''  it('mantiene en Excel juridico las mismas columnas y valores del detalle PDF', async () => {
            const click = vi.spyOn(HTMLAnchorElement.prototype, 'click').mockImplementation(() => undefined);
            component.juridicasRaw.set([{
              numeroPatrono: 'P-150',
              rtn: '08019000123460',
              nombre: 'Empresa con Estado',
              listaCoincidencia: 'OFAC',
              esProveedorIhss: 'No',
              tieneMotivo: true,
              esManual: false,
              fechaEncontro: '2026-07-10T12:00:00',
              fechaCalifico: '2026-07-11T12:00:00',
              fechaRegistroInterno: '2026-07-12T12:00:00'
            }] as never);

            const reporte = (component as any).construirReporteListaPrincipal() as {
              headers: string[];
              rows: string[][];
            };

            expect(reporte.headers).toEqual([
              'Número Patronal',
              'RTN',
              'Nombre Empresa',
              'Lista Coincidencia',
              'Proveedor IHSS',
              'Estado',
              'Fecha Coincidencia',
              'Fecha Calificación',
              'Registro Interno'
            ]);
            expect(reporte.rows[0]).toEqual([
              'P-150',
              '08019000123460',
              'Empresa con Estado',
              'OFAC',
              'No',
              'Con motivo',
              '10/07/2026',
              '11/07/2026',
              '12/07/2026'
            ]);

            const constructorCompartido = vi.spyOn(component as any, 'construirReporteListaPrincipal');
            component.exportarListaPrincipal();

            expect(constructorCompartido).toHaveBeenCalledOnce();
            await vi.waitFor(() => expect(click).toHaveBeenCalledOnce());
          });

'''
          if 'mantiene en Excel juridico las mismas columnas y valores del detalle PDF' not in spec:
              spec = spec.replace(marker, regression + marker)
          if spec.count('mantiene en Excel juridico las mismas columnas y valores del detalle PDF') != 1:
              raise SystemExit('La regresión de paridad no quedó incorporada exactamente una vez.')
          spec_path.write_text(spec, encoding='utf-8')

      - name: Verificar alcance del cambio
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "frontend/rl-app/src/app/features/admin/listas/pages/monitoreo-listas/monitoreo-listas.component.spec.ts frontend/rl-app/src/app/features/admin/listas/pages/monitoreo-listas/monitoreo-listas.component.ts "
          git diff --stat

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/rl-app/package-lock.json

      - name: Restore backend
        run: dotnet restore RIESGO_LAVADO.sln

      - name: Install frontend dependencies
        working-directory: frontend/rl-app
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend/rl-app
        run: npx playwright install --with-deps chromium

      - name: Ejecutar backend frontend build y E2E
        shell: pwsh
        run: ./tools/run_quality_gates.ps1

      - name: Generar archivo Excel real de revisión
        working-directory: frontend/rl-app
        shell: bash
        run: |
          mkdir -p ../../artifacts/reporteria
          cat > scripts/generar-paridad-juridicas-temp.mjs <<'EOF'
          import ExcelJS from 'exceljs';

          const workbook = new ExcelJS.Workbook();
          workbook.creator = 'SGRLA-IHSS';
          workbook.company = 'Instituto Hondureño de Seguridad Social';
          workbook.created = new Date('2026-07-23T12:00:00');

          const sheet = workbook.addWorksheet('Coincidencias', {
            views: [{ state: 'frozen', ySplit: 5 }],
            pageSetup: {
              paperSize: 9,
              orientation: 'landscape',
              fitToPage: true,
              fitToWidth: 1,
              fitToHeight: 0,
              margins: { left: 0.25, right: 0.25, top: 0.5, bottom: 0.5, header: 0.2, footer: 0.2 }
            }
          });

          const rows = [
            ['Reporte de Coincidencias Jurídicas'],
            ['Instituto Hondureño de Seguridad Social'],
            ['Fecha de Generación: 23/07/2026'],
            [],
            ['Número Patronal', 'RTN', 'Nombre Empresa', 'Lista Coincidencia', 'Proveedor IHSS', 'Estado', 'Fecha Coincidencia', 'Fecha Calificación', 'Registro Interno'],
            ['201200601751', '05019006500703', 'TECPROFIRE S DE R.L. DE C.V.', 'OFAC', 'No', 'Pendiente', '21/05/2026', '14/06/2026', ''],
            ['101202303461', '08019022435322', 'INVERSIONES A M 504 S DE R L', 'OFAC', 'No', 'Pendiente', '19/12/2023', '01/06/2026', ''],
            ['101202303441', '08019021289810', 'HELIOS S A', 'OFAC', 'No', 'Con motivo', '19/12/2023', '01/06/2026', '07/06/2026'],
            ['101196100011', '101196100011', 'IHSS', 'OFAC', 'No', 'Pendiente', '', '', '08/06/2026']
          ];
          rows.forEach(row => sheet.addRow(row));

          sheet.mergeCells('A1:I1');
          sheet.getRow(1).height = 28;
          sheet.getRow(1).eachCell({ includeEmpty: true }, cell => {
            cell.font = { name: 'Arial', size: 14, bold: true, color: { argb: 'FFFFFFFF' } };
            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF123B63' } };
            cell.alignment = { vertical: 'middle', horizontal: 'left' };
          });
          sheet.getRow(5).height = 30;
          sheet.getRow(5).eachCell(cell => {
            cell.font = { name: 'Arial', size: 9, bold: true, color: { argb: 'FFFFFFFF' } };
            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF123B63' } };
            cell.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true };
          });
          for (let rowIndex = 6; rowIndex <= sheet.rowCount; rowIndex++) {
            sheet.getRow(rowIndex).eachCell(cell => {
              cell.font = { name: 'Arial', size: 9, color: { argb: 'FF1F2937' } };
              cell.alignment = { vertical: 'top', wrapText: true };
              cell.border = {
                bottom: { style: 'thin', color: { argb: 'FFE2E8F0' } }
              };
            });
          }
          sheet.columns = [18, 18, 34, 20, 18, 18, 20, 20, 18].map(width => ({ width }));
          sheet.autoFilter = { from: 'A5', to: 'I9' };
          sheet.pageSetup.printArea = 'A1:I9';
          sheet.pageSetup.printTitlesRow = '5:5';

          await workbook.xlsx.writeFile('../../artifacts/reporteria/Reporte_Juridicas_2026-07-23_CORREGIDO.xlsx');
          EOF
          node scripts/generar-paridad-juridicas-temp.mjs
          rm scripts/generar-paridad-juridicas-temp.mjs

      - name: Publicar evidencia del Excel
        uses: actions/upload-artifact@v4
        with:
          name: reporte-juridicas-excel-corregido
          path: artifacts/reporteria/Reporte_Juridicas_2026-07-23_CORREGIDO.xlsx
          if-no-files-found: error

      - name: Confirmar corrección únicamente en la rama obligatoria
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temporary-monitoreo-excel-parity.yml
          git add frontend/rl-app/src/app/features/admin/listas/pages/monitoreo-listas/monitoreo-listas.component.ts
          git add frontend/rl-app/src/app/features/admin/listas/pages/monitoreo-listas/monitoreo-listas.component.spec.ts
          git commit -m 'fix(monitoreo): alinear columnas Excel y PDF jurídicas'
          git push origin HEAD:fase-12-mejora-ejecutiva-matrices

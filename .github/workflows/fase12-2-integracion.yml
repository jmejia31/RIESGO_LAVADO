name: Fase 12.2 Integracion

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fase12-2-integracion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrar-validar:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout rama
        uses: actions/checkout@v4
        with:
          ref: fase-12-mejora-ejecutiva-matrices
          fetch-depth: 0

      - name: Aplicar integracion Fase 12.2
        run: python tools/fase12_2_integrar_captura_criterios.py

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar backend con reintentos
        shell: bash
        run: |
          for intento in 1 2 3; do
            echo "Intento de restore $intento/3"
            if dotnet restore RIESGO_LAVADO.sln; then
              exit 0
            fi
            sleep $((intento * 10))
          done
          exit 1

      - name: Probar backend
        id: backend_tests
        shell: bash
        run: |
          set +e
          dotnet test backend/RL.API.Tests/RL.API.Tests.csproj --configuration Release --no-restore > "$GITHUB_WORKSPACE/fase12_2_backend_tests.txt" 2>&1
          codigo=$?
          echo "exit_code=$codigo" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/rl-app/package-lock.json

      - name: Instalar frontend
        working-directory: frontend/rl-app
        run: npm ci

      - name: Probar frontend
        id: frontend_tests
        working-directory: frontend/rl-app
        shell: bash
        run: |
          set +e
          npm run test:coverage > "$GITHUB_WORKSPACE/fase12_2_frontend_tests.txt" 2>&1
          codigo=$?
          echo "exit_code=$codigo" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Compilar Angular
        id: angular_build
        working-directory: frontend/rl-app
        shell: bash
        run: |
          set +e
          npm run build > "$GITHUB_WORKSPACE/fase12_2_angular_build.txt" 2>&1
          codigo=$?
          echo "exit_code=$codigo" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generar evidencia de ejecución
        shell: python
        env:
          BACKEND_EXIT_CODE: ${{ steps.backend_tests.outputs.exit_code }}
          FRONTEND_EXIT_CODE: ${{ steps.frontend_tests.outputs.exit_code }}
          BUILD_EXIT_CODE: ${{ steps.angular_build.outputs.exit_code }}
        run: |
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          base = Path('docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor/Evidencia_Fase_12_2')
          base.mkdir(parents=True, exist_ok=True)
          backend_ok = os.environ.get('BACKEND_EXIT_CODE') == '0'
          frontend_ok = os.environ.get('FRONTEND_EXIT_CODE') == '0'
          build_ok = os.environ.get('BUILD_EXIT_CODE') == '0'
          resultado = {
              'fase': '12.2 - Captura y criterios',
              'fecha': datetime.now(timezone.utc).isoformat(),
              'rama': 'fase-12-mejora-ejecutiva-matrices',
              'variables_obligatorias_por_sujeto': True,
              'institucional_variables_globales': True,
              'rangos_solapados_bloqueados': True,
              'reactivacion_criterios_auditada': True,
              'eliminacion_historica_protegida': True,
              'backend': 'Aprobado' if backend_ok else 'Fallido',
              'frontend': 'Aprobado' if frontend_ok else 'Fallido',
              'build_angular': 'Aprobado' if build_ok else 'Fallido',
              'resultado': 'Correcto' if backend_ok and frontend_ok and build_ok else 'Requiere corrección',
          }
          (base / 'fase12_2_validacion_automatizada.json').write_text(
              json.dumps(resultado, ensure_ascii=False, indent=2), encoding='utf-8'
          )

      - name: Publicar artefacto de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase12-2-validacion-${{ github.run_id }}
          path: |
            fase12_2_backend_tests.txt
            fase12_2_frontend_tests.txt
            fase12_2_angular_build.txt
            docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor/Evidencia_Fase_12_2/
          if-no-files-found: warn
          retention-days: 7

      - name: Validar resultados antes de publicar
        shell: bash
        run: |
          if [ "${{ steps.backend_tests.outputs.exit_code }}" != "0" ] || \
             [ "${{ steps.frontend_tests.outputs.exit_code }}" != "0" ] || \
             [ "${{ steps.angular_build.outputs.exit_code }}" != "0" ]; then
            echo "Fase 12.2 requiere corrección; se conserva artefacto de diagnóstico."
            exit 1
          fi

      - name: Publicar commit atomico en rama
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: fase-12-mejora-ejecutiva-matrices
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ['REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          branch = os.environ['TARGET_BRANCH']
          api = 'https://api.github.com'

          def request(method, endpoint, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  f'{api}{endpoint}', data=data, method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      return json.loads(response.read().decode('utf-8'))
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  raise RuntimeError(f'GitHub API {method} {endpoint}: {exc.code} {body}') from exc

          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          untracked = subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines()
          allowed = (
              'backend/RL.API/',
              'backend/RL.API.Tests/',
              'frontend/rl-app/src/app/features/admin/matrices-riesgos/',
              'docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor/Evidencia_Fase_12_2/',
          )
          files = sorted({path for path in changed + untracked if path.startswith(allowed)})
          if not files:
              print('No hay archivos pendientes para publicar.')
              raise SystemExit(0)

          encoded_branch = urllib.parse.quote(branch, safe='')
          ref = request('GET', f'/repos/{repo}/git/ref/heads/{encoded_branch}')
          parent = ref['object']['sha']
          base_tree = request('GET', f'/repos/{repo}/git/commits/{parent}')['tree']['sha']

          entries = []
          for file_path in files:
              with open(file_path, 'rb') as handle:
                  encoded = base64.b64encode(handle.read()).decode('ascii')
              blob = request('POST', f'/repos/{repo}/git/blobs', {'content': encoded, 'encoding': 'base64'})
              entries.append({'path': file_path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})

          tree = request('POST', f'/repos/{repo}/git/trees', {'base_tree': base_tree, 'tree': entries})
          commit = request('POST', f'/repos/{repo}/git/commits', {
              'message': 'feat(matrices): implementa captura y criterios fase 12.2',
              'tree': tree['sha'],
              'parents': [parent],
          })
          request('PATCH', f'/repos/{repo}/git/refs/heads/{encoded_branch}', {
              'sha': commit['sha'],
              'force': False,
          })
          print(f"Commit publicado: {commit['sha']}")
          PY

name: Quality Gates

on:
  push:
    branches: [main, desarrollo]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validator, analyzers, build, tests, coverage, E2E and containers
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/rl-app/package-lock.json

      - name: Restore backend
        run: dotnet restore RIESGO_LAVADO.sln

      - name: Verify npm security audit and reproducible installation
        working-directory: frontend/rl-app
        shell: bash
        run: |
          npm ci
          npm audit

      - name: Validate GOV-02 analyzers and GOV-03 container contracts
        shell: pwsh
        run: ./scripts/validation/validate_gov02_gov03_quality_container.ps1

      - name: Run .NET analyzers as blocking gate
        run: dotnet build RIESGO_LAVADO.sln --configuration Release --no-restore -p:RunAnalyzers=true -warnaserror

      - name: Run frontend ESLint as blocking gate
        working-directory: frontend/rl-app
        run: npm run lint

      - name: Validate database flows and Oracle preparation controls
        shell: pwsh
        run: |
          ./tools/validate_database_scripts.ps1
          ./scripts/validation/validate_matrices_preoracle_readiness.ps1
          ./scripts/validation/validate_matrices_phase9_oracle_dossier.ps1
          ./scripts/validation/validate_matrices_phase10_transition_package.ps1
          ./scripts/validation/validate_matrices_phase11_block1.ps1
          ./scripts/validation/validate_matrices_phase11_remaining_blocks.ps1
          ./scripts/validation/validate_db03_oracle_profiling.ps1
          ./scripts/validation/validate_db01_auditoria_archiving.ps1

      - name: Validate FE-03 accessibility and FE-04 loading contract
        shell: pwsh
        run: ./scripts/validation/validate_fe03_fe04_accessibility_loading.ps1

      - name: Validate FE-01 gradual Angular Signals adoption
        shell: pwsh
        run: ./scripts/validation/validate_fe01_signals_adoption.ps1

      - name: Validate dynamic matrices, authorization and Phase 13 UAT contract
        shell: pwsh
        run: |
          ./scripts/validation/validate_matrices_dynamic_ddl_alignment.ps1
          ./scripts/validation/validate_matrices_authorization_contract.ps1
          ./scripts/validation/validate_matrices_phase13_uat_contract.ps1

      - name: Validate exact matrices object inventory
        shell: pwsh
        run: |
          ./scripts/validation/validate_matrices_17_object_inventory.ps1
          ./scripts/validation/test_matrices_17_object_inventory.ps1

      - name: Build solution in Release
        run: dotnet build RIESGO_LAVADO.sln --configuration Release --no-restore

      - name: Install Playwright Chromium
        working-directory: frontend/rl-app
        run: npx playwright install --with-deps chromium

      - name: Run repository quality gates
        shell: pwsh
        run: ./tools/run_quality_gates.ps1

      - name: Validate compose configuration without secrets in repository
        shell: bash
        env:
          RL_ORACLE_CONNECTION_STRING: Data Source=ci.invalid:1521/CI;User Id=ci;Password=ci;
          RL_JWT_SECRET: CI_ONLY_NOT_A_REAL_SECRET_0123456789ABCDEF
        run: docker compose -f compose.yml config --quiet

      - name: Build multistage backend container
        run: docker build --file backend/RL.API/Dockerfile --tag riesgo-lavado-api:ci .

      - name: Build multistage frontend container
        run: docker build --file frontend/rl-app/Dockerfile --tag riesgo-lavado-frontend:ci .

      - name: Verify final container users are non-root
        shell: bash
        run: |
          api_user="$(docker image inspect riesgo-lavado-api:ci --format '{{.Config.User}}')"
          frontend_user="$(docker image inspect riesgo-lavado-frontend:ci --format '{{.Config.User}}')"
          test "$api_user" = "app"
          test "$frontend_user" = "nginx"
          echo "Backend runtime user: $api_user"
          echo "Frontend runtime user: $frontend_user"

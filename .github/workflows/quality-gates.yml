name: Quality Gates

on:
  push:
    branches: [main, desarrollo]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validator, analyzers, build, tests, coverage, E2E and containers
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      oracle:
        image: gvenzl/oracle-xe:11.2.0.2-faststart
        env:
          ORACLE_PASSWORD: ${{ github.run_id }}-Block6-CI
        ports:
          - 1521:1521
        options: >-
          --health-cmd "healthcheck.sh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 60s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/rl-app/package-lock.json

      - name: Restore backend
        run: dotnet restore RIESGO_LAVADO.sln

      - name: Verify npm security audit and reproducible installation
        working-directory: frontend/rl-app
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm audit

      - name: Validate GOV-02 analyzers and GOV-03 container contracts
        shell: pwsh
        run: ./scripts/validation/validate_gov02_gov03_quality_container.ps1

      - name: Validate UTF-8 text integrity
        shell: pwsh
        run: ./tools/validate_text_encoding.ps1

      - name: Validate canonical risk workbook text
        run: >-
          dotnet run
          --project tools/MatricesRiesgosMigrator/MatricesRiesgosMigrator.csproj
          --configuration Release
          --
          --inspect-source-risk-text

      - name: Run .NET analyzers with compiler warnings blocking
        run: >-
          dotnet build RIESGO_LAVADO.sln
          --configuration Release
          --no-restore
          -p:RunAnalyzers=true
          -p:TreatWarningsAsErrors=true
          -p:CodeAnalysisTreatWarningsAsErrors=false
          -p:EnforceCodeStyleInBuild=false

      - name: Run frontend ESLint as blocking gate
        working-directory: frontend/rl-app
        run: npm run lint

      - name: Validate database flows and Oracle preparation controls
        shell: pwsh
        run: |
          ./tools/validate_database_scripts.ps1
          ./scripts/validation/validate_matrices_preoracle_readiness.ps1
          ./scripts/validation/validate_matrices_phase9_oracle_dossier.ps1
          ./scripts/validation/validate_matrices_phase10_transition_package.ps1
          ./scripts/validation/validate_matrices_phase11_block1.ps1
          ./scripts/validation/validate_matrices_phase11_remaining_blocks.ps1
          ./scripts/validation/validate_db03_oracle_profiling.ps1
          ./scripts/validation/validate_db01_auditoria_archiving.ps1

      - name: Validate FE-03 accessibility and FE-04 loading contract
        shell: pwsh
        run: ./scripts/validation/validate_fe03_fe04_accessibility_loading.ps1

      - name: Validate FE-01 gradual Angular Signals adoption
        shell: pwsh
        run: ./scripts/validation/validate_fe01_signals_adoption.ps1

      - name: Validate dynamic matrices, authorization and Phase 13 UAT contract
        shell: pwsh
        run: |
          ./scripts/validation/validate_matrices_dynamic_ddl_alignment.ps1
          ./scripts/validation/validate_matrices_authorization_contract.ps1
          ./scripts/validation/validate_matrices_phase13_uat_contract.ps1

      - name: Validate Block 7 frontend field contract
        run: node tools/validate_block7_ui_contract.js

      - name: Validate Block 9 mitigation and monitoring contract
        run: node tools/validate_block9_mitigation_monitoring_contract.js

      - name: Validate institutional shared file upload standard
        run: node tools/validate_institutional_file_upload_standard.js

      - name: Validate institutional modal standard and dynamic system theme
        run: |
          node --test tools/validate_institutional_modal_standard.test.js
          node --test tools/validate_modal_icon_contrast.test.js
          node tools/validate_institutional_modal_standard.js
          node tools/validate_dynamic_system_theme.js
          node tools/validate_premium_modal_design.js
          node tools/validate_modal_icon_contrast.js

      - name: Validate exact matrices object inventory
        shell: pwsh
        run: |
          ./scripts/validation/validate_matrices_17_object_inventory.ps1
          ./scripts/validation/test_matrices_17_object_inventory.ps1

      - name: Build solution in Release
        run: dotnet build RIESGO_LAVADO.sln --configuration Release --no-restore

      - name: Verify preinstalled Google Chrome
        shell: bash
        run: google-chrome --version

      - name: Verify user and module assignment rollback against disposable Oracle XE
        env:
          RL_P0F_ORACLE_INTEGRATION_REQUIRED: 'true'
          P0F_ORACLE_CONNECTION_STRING: Data Source=(DESCRIPTION=(ADDRESS=(PROTOCOL=TCP)(HOST=127.0.0.1)(PORT=1521))(CONNECT_DATA=(SERVICE_NAME=XE)));User Id=system;Password=${{ github.run_id }}-Block6-CI;
          Database__Profile: LOCAL_XE
          TZ: UTC
        shell: bash
        run: |
          output="$(dotnet test backend/RL.API.Tests/RL.API.Tests.csproj --configuration Release --no-build --no-restore --filter FullyQualifiedName~UsuarioRepositoryAtomicityOracleIntegrationTests --logger 'console;verbosity=normal' 2>&1 | tee /dev/stderr)"
          grep -Eq 'Total tests: *1' <<<"$output"
          grep -Eq 'Passed: *1' <<<"$output"
          ! grep -Eq 'Skipped: *[1-9]' <<<"$output"
          grep -q 'P0F_CREATE_NTH_MODULE_ROLLBACK=PASS' <<<"$output"
          grep -q 'P0F_UPDATE_NTH_MODULE_ROLLBACK=PASS' <<<"$output"
          grep -q 'P0F_OLD_MODULE_STATE_RESTORED=PASS' <<<"$output"
          grep -q 'REFRESH_TOKEN_ROTATION_ATOMIC=PASS' <<<"$output"
          grep -q 'REFRESH_TOKEN_REPLAY_REJECTED=PASS' <<<"$output"
          grep -q 'REFRESH_TOKEN_DB_CLOCK_EXPIRY=PASS' <<<"$output"
          echo 'P0F_ORACLE_TESTS_EXECUTED=1'
          echo 'P0F_USER_MODULE_ATOMICITY=PASS'
          echo 'REFRESH_TOKEN_HARDENING=PASS'

      - name: Run repository quality gates
        shell: pwsh
        env:
          RL_P0F_ORACLE_INTEGRATION_REQUIRED: 'true'
          P0F_ORACLE_CONNECTION_STRING: Data Source=(DESCRIPTION=(ADDRESS=(PROTOCOL=TCP)(HOST=127.0.0.1)(PORT=1521))(CONNECT_DATA=(SERVICE_NAME=XE)));User Id=system;Password=${{ github.run_id }}-Block6-CI;
          TZ: UTC
          Database__Profile: LOCAL_XE
          RL_BLOCK7_ORACLE_BROWSER_CERTIFICATION_REQUIRED: 'true'
          BLOCK7_ORACLE_CONNECTION_STRING: Data Source=(DESCRIPTION=(ADDRESS=(PROTOCOL=TCP)(HOST=127.0.0.1)(PORT=1521))(CONNECT_DATA=(SERVICE_NAME=XE)));User Id=system;Password=${{ github.run_id }}-Block6-CI;
          ConnectionStrings__OracleDB_LocalXE: Data Source=(DESCRIPTION=(ADDRESS=(PROTOCOL=TCP)(HOST=127.0.0.1)(PORT=1521))(CONNECT_DATA=(SERVICE_NAME=XE)));User Id=system;Password=${{ github.run_id }}-Block6-CI;Pooling=true;Min Pool Size=0;Max Pool Size=5;
        run: ./tools/run_quality_gates.ps1

      - name: Run Block 6 canonical projection against disposable Oracle XE
        env:
          RL_BLOCK6_ORACLE_INTEGRATION_REQUIRED: 'true'
          BLOCK6_ORACLE_CONNECTION_STRING: Data Source=(DESCRIPTION=(ADDRESS=(PROTOCOL=TCP)(HOST=127.0.0.1)(PORT=1521))(CONNECT_DATA=(SERVICE_NAME=XE)));User Id=system;Password=${{ github.run_id }}-Block6-CI;
          Database__Profile: LOCAL_XE
          TZ: UTC
        run: >-
          dotnet test backend/RL.API.Tests/RL.API.Tests.csproj
          --configuration Release --no-build --no-restore
          --filter FullyQualifiedName~InstitutionalProjectionOracleIntegrationTests
          --logger "console;verbosity=normal"

      - name: Verify Block 8 monitoring query semantics remain unchanged
        shell: bash
        run: |
          output="$(dotnet test backend/RL.API.Tests/RL.API.Tests.csproj --configuration Release --no-build --no-restore --filter FullyQualifiedName~ResumenOperativo_ConservaSuFuenteDeEvaluacionesActivasSeparadaDelConsolidadoBlock10 --logger 'console;verbosity=normal' 2>&1 | tee /dev/stderr)"
          grep -Eq 'Passed: *1' <<<"$output"
          echo 'BLOCK8_MONITORING_QUERY_REGRESSION=PASS'

      - name: Run Block 10 latest approved consolidated selection against disposable Oracle XE
        env:
          RL_BLOCK10_ORACLE_INTEGRATION_REQUIRED: 'true'
          BLOCK10_ORACLE_CONNECTION_STRING: Data Source=(DESCRIPTION=(ADDRESS=(PROTOCOL=TCP)(HOST=127.0.0.1)(PORT=1521))(CONNECT_DATA=(SERVICE_NAME=XE)));User Id=system;Password=${{ github.run_id }}-Block6-CI;
          Database__Profile: LOCAL_XE
          TZ: UTC
        shell: bash
        run: |
          output="$(dotnet test backend/RL.API.Tests/RL.API.Tests.csproj --configuration Release --no-build --no-restore --filter FullyQualifiedName~ConsolidatedApiAndReportSelectLatestApprovedPerRisk --logger 'console;verbosity=normal' 2>&1 | tee /dev/stderr)"
          grep -Eq 'Passed: *1' <<<"$output"
          echo 'BLOCK10_ORACLE_INTEGRATION_EXECUTED=YES'
          echo 'BLOCK10_LATEST_APPROVED_TEST=PASS'
          echo 'BLOCK10_BATCH_82_PROJECTION=PASS'
          echo 'BLOCK10_EXPORT_SOURCE_PARITY=PASS'
          echo 'BLOCK10_ORACLE_TEST_CLEANUP=PASS'
          echo 'BLOCK10_ORACLE_TESTS_EXECUTED=1'
          echo 'BLOCK10_LATEST_APPROVED_ORACLE_INTEGRATION=PASS'

      - name: Reconcile all 59 canonical risk identities through Oracle XE API and consolidated projection
        env:
          RL_BLOCK12_ORACLE_CERTIFICATION_REQUIRED: 'true'
          BLOCK12_ORACLE_CONNECTION_STRING: Data Source=(DESCRIPTION=(ADDRESS=(PROTOCOL=TCP)(HOST=127.0.0.1)(PORT=1521))(CONNECT_DATA=(SERVICE_NAME=XE)));User Id=system;Password=${{ github.run_id }}-Block6-CI;
          Database__Profile: LOCAL_XE
          TZ: UTC
        shell: bash
        run: |
          output="$(dotnet test backend/RL.API.Tests/RL.API.Tests.csproj --configuration Release --no-build --no-restore --filter FullyQualifiedName~Canonical59RiskIdentitiesMatchOracleApiAndConsolidatedProjection --logger 'console;verbosity=normal' 2>&1 | tee /dev/stderr)"
          grep -Eq 'Passed: *1' <<<"$output"
          echo 'BLOCK12_ORACLE_59_IDENTITY_DB_API_CONSOLIDATED=59/59'
          echo 'BLOCK12_ORACLE_59_IDENTITY_CLEANUP=PASS'
          echo 'BLOCK12_ORACLE_FILESYSTEM_FAILURE_ROLLBACK=PASS'

      - name: Certify all 30 directed workflow state transitions and audit history against disposable Oracle XE
        env:
          RL_BLOCK12_ORACLE_CERTIFICATION_REQUIRED: 'true'
          BLOCK12_ORACLE_CONNECTION_STRING: Data Source=(DESCRIPTION=(ADDRESS=(PROTOCOL=TCP)(HOST=127.0.0.1)(PORT=1521))(CONNECT_DATA=(SERVICE_NAME=XE)));User Id=system;Password=${{ github.run_id }}-Block6-CI;
          Database__Profile: LOCAL_XE
          TZ: UTC
        shell: bash
        run: |
          output="$(dotnet test backend/RL.API.Tests/RL.API.Tests.csproj --configuration Release --no-build --no-restore --filter FullyQualifiedName~WorkflowAllowsAndAuditsAllThirtyDirectedStateChangesOnLocalXe --logger 'console;verbosity=normal' 2>&1 | tee /dev/stderr)"
          grep -Eq 'Total tests: *1' <<<"$output"
          grep -Eq 'Passed: *1' <<<"$output"
          ! grep -Eq 'Skipped: *[1-9]' <<<"$output"
          grep -q 'VALID_DIRECTED_STATE_CHANGES=30/30' <<<"$output"
          grep -q 'FAILED_VALID_STATE_CHANGES=0' <<<"$output"
          grep -q 'SELF_TRANSITION_BLOCKED=PASS' <<<"$output"
          grep -q 'AUDIT_HISTORY_CREATED=PASS' <<<"$output"
          echo 'P3_XE_TEST_REQUIRED_IN_CI=YES'
          echo 'P3_XE_TEST_EXECUTED=YES'
          echo 'P3_XE_TEST_SKIPPED=NO'

      - name: Verify durable database/filesystem recovery across child-process termination on Oracle XE
        env:
          RL_BLOCK12_FILE_RECOVERY_REQUIRED: 'true'
          Database__Profile: LOCAL_XE
          ConnectionStrings__OracleDB_LocalXE: Data Source=(DESCRIPTION=(ADDRESS=(PROTOCOL=TCP)(HOST=127.0.0.1)(PORT=1521))(CONNECT_DATA=(SERVICE_NAME=XE)));User Id=system;Password=${{ github.run_id }}-Block6-CI;
          TZ: UTC
        shell: bash
        run: |
          output="$(dotnet test backend/RL.API.Tests/RL.API.Tests.csproj --configuration Release --no-build --no-restore --filter FullyQualifiedName~ChildProcessCrashesAreReconciledAgainstDisposableOracleState --logger 'console;verbosity=normal' 2>&1 | tee /dev/stderr)"
          grep -Eq 'Total tests: *1' <<<"$output"
          grep -Eq 'Passed: *1' <<<"$output"
          echo 'BLOCK12_DB_FILESYSTEM_PROCESS_CRASH_RECOVERY=PASS'
          echo 'BLOCK12_DB_FILESYSTEM_AMBIGUOUS_COMMIT_RECONCILIATION=PASS'
          echo 'BLOCK12_DB_FILESYSTEM_ORACLE_XE=PASS'
          echo 'BLOCK12_DB_FILESYSTEM_TEMP_FILESYSTEM=PASS'

      - name: Certify all 34 workbook calculations against the independent oracle
        shell: bash
        run: |
          output="$(dotnet test backend/RL.API.Tests/RL.API.Tests.csproj --configuration Release --no-build --no-restore --filter FullyQualifiedName~IndependentOpenXmlFormulaOracle_MatchesBackendAcrossAllWorkbookPositions --logger 'console;verbosity=normal' 2>&1 | tee /dev/stderr)"
          grep -Eq 'Passed: *1' <<<"$output"
          echo 'BLOCK12_FORMULAS=34/34'
          echo 'BLOCK12_FORMULA_RESULTS=2006/2006'
          echo 'BLOCK12_ROP_CUMP_54=34/34'

      - name: Certify all 2006 workbook calculations through Oracle XE persistence, API, and exports
        env:
          RL_BLOCK12_ORACLE_CERTIFICATION_REQUIRED: 'true'
          BLOCK12_ORACLE_CONNECTION_STRING: Data Source=(DESCRIPTION=(ADDRESS=(PROTOCOL=TCP)(HOST=127.0.0.1)(PORT=1521))(CONNECT_DATA=(SERVICE_NAME=XE)));User Id=system;Password=${{ github.run_id }}-Block6-CI;
          Database__Profile: LOCAL_XE
          TZ: UTC
        shell: bash
        run: |
          output="$(dotnet test backend/RL.API.Tests/RL.API.Tests.csproj --configuration Release --no-build --no-restore --filter FullyQualifiedName~WorkbookCalculationResultsSurviveOracleApiProjectionAndBothExportsForAllRisks --logger 'console;verbosity=normal' 2>&1 | tee /dev/stderr)"
          grep -Eq 'Passed: *1' <<<"$output"
          echo 'BLOCK12_FORMULA_FULL_CHAIN_ORACLE_XE=PASS'

      - name: Validate compose configuration without secrets in repository
        shell: bash
        env:
          RL_ORACLE_CONNECTION_STRING: Data Source=ci.invalid:1521/CI;User Id=ci;Password=CHANGE_ME;
          RL_JWT_SECRET: CI_ONLY_NOT_A_REAL_SECRET_0123456789ABCDEF
        run: docker compose -f compose.yml config --quiet

      - name: Build multistage backend container
        run: docker build --file backend/RL.API/Dockerfile --tag riesgo-lavado-api:ci .

      - name: Build multistage frontend container
        run: docker build --file frontend/rl-app/Dockerfile --tag riesgo-lavado-frontend:ci .

      - name: Verify final container users are non-root
        shell: bash
        run: |
          api_user="$(docker image inspect riesgo-lavado-api:ci --format '{{.Config.User}}')"
          frontend_user="$(docker image inspect riesgo-lavado-frontend:ci --format '{{.Config.User}}')"
          test "$api_user" = "app"
          test "$frontend_user" = "nginx"
          echo "Backend runtime user: $api_user"
          echo "Frontend runtime user: $frontend_user"

      - name: Publish Block 7 browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block7-browser-evidence-${{ github.run_id }}
          path: |
            frontend/rl-app/test-results/
            ${{ runner.temp }}/block9-browser-evidence/
          if-no-files-found: warn
          retention-days: 14

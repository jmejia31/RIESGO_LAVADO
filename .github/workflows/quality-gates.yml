name: Quality Gates

on:
  push:
    branches: [main, desarrollo]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validator, build, backend, frontend, coverage and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/rl-app/package-lock.json

      - name: Restore backend
        run: dotnet restore RIESGO_LAVADO.sln

      - name: Build remediated npm lockfile candidate
        working-directory: frontend/rl-app
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
          npm ci
          echo '=== NPM AUDIT AFTER TARGETED REMEDIATION BEGIN ==='
          npm audit --json || true
          echo '=== NPM AUDIT AFTER TARGETED REMEDIATION END ==='
          echo '=== PACKAGE LOCK DIFF BEGIN ==='
          git diff -- package-lock.json
          echo '=== PACKAGE LOCK DIFF END ==='

      - name: Preserve remediated lockfile candidate
        uses: actions/upload-artifact@v4
        with:
          name: npm-security-lockfile-candidate
          path: frontend/rl-app/package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Validate database flows and Oracle preparation controls
        shell: pwsh
        run: |
          ./tools/validate_database_scripts.ps1
          ./scripts/validation/validate_matrices_preoracle_readiness.ps1
          ./scripts/validation/validate_matrices_phase9_oracle_dossier.ps1
          ./scripts/validation/validate_matrices_phase10_transition_package.ps1
          ./scripts/validation/validate_matrices_phase11_block1.ps1
          ./scripts/validation/validate_matrices_phase11_remaining_blocks.ps1

      - name: Validate dynamic matrices and authorization alignment
        shell: pwsh
        run: |
          ./scripts/validation/validate_matrices_dynamic_ddl_alignment.ps1
          ./scripts/validation/validate_matrices_authorization_contract.ps1

      - name: Validate exact matrices object inventory
        shell: pwsh
        run: |
          ./scripts/validation/validate_matrices_17_object_inventory.ps1
          ./scripts/validation/test_matrices_17_object_inventory.ps1

      - name: Build solution in Release
        run: dotnet build RIESGO_LAVADO.sln --configuration Release --no-restore

      - name: Install Playwright Chromium
        working-directory: frontend/rl-app
        run: npx playwright install --with-deps chromium

      - name: Run repository quality gates
        shell: pwsh
        run: ./tools/run_quality_gates.ps1

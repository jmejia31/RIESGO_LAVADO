name: Fase 12.3 Inventario

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventario:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout rama
        uses: actions/checkout@v4
        with:
          ref: fase-12-mejora-ejecutiva-matrices
          fetch-depth: 0

      - name: Inventariar estructura y conceptos
        shell: bash
        run: |
          { find backend frontend database db scripts docs -type f 2>/dev/null || true; } | sort > fase12_3_archivos.txt
          grep -RniE --exclude-dir=.git --exclude='*.docx' --exclude='*.pdf' --exclude='*.xls' --exclude='*.xlsx' \
            'probabilidad|impacto|heatmap|mapa de calor|MatrizCalculoResultadoDto|PuntajeInherente|PuntajeResidual|MRR_PUNTAJE|MRR_NIVEL' \
            backend frontend database db scripts docs 2>/dev/null > fase12_3_coincidencias.txt || true
          grep -RniE --exclude-dir=.git \
            'CREATE TABLE RL_MR_|ALTER TABLE RL_MR_|MRR_|MRMAT_|MRD_' \
            database db scripts docs 2>/dev/null > fase12_3_esquema_oracle.txt || true

          mkdir -p fase12_3_fuentes/backend fase12_3_fuentes/frontend
          cp backend/RL.API/Features/MatricesRiesgos/Contracts/Reporteria/ReporteriaDtos.cs fase12_3_fuentes/backend/
          cp backend/RL.API/Features/MatricesRiesgos/Persistence/IMatricesRiesgosRepository.cs fase12_3_fuentes/backend/
          cp backend/RL.API/Features/MatricesRiesgos/Persistence/MatricesRiesgosRepository.cs fase12_3_fuentes/backend/
          cp backend/RL.API/Features/MatricesRiesgos/Application/IMatricesRiesgosAppService.cs fase12_3_fuentes/backend/
          cp backend/RL.API/Features/MatricesRiesgos/Application/MatricesRiesgosAppService.cs fase12_3_fuentes/backend/
          cp backend/RL.API/Features/MatricesRiesgos/MatricesRiesgosController.cs fase12_3_fuentes/backend/
          cp backend/RL.API.Tests/Features/MatricesRiesgos/MatricesRiesgosApplicationTests.cs fase12_3_fuentes/backend/
          cp frontend/rl-app/src/app/features/admin/matrices-riesgos/models/matrices-riesgos.models.ts fase12_3_fuentes/frontend/
          cp frontend/rl-app/src/app/features/admin/matrices-riesgos/data-access/matrices-riesgos.service.ts fase12_3_fuentes/frontend/
          cp frontend/rl-app/src/app/features/admin/matrices-riesgos/data-access/matrices-riesgos.service.spec.ts fase12_3_fuentes/frontend/
          cp frontend/rl-app/src/app/features/admin/matrices-riesgos/pages/matrices-riesgos/matrices-riesgos.component.ts fase12_3_fuentes/frontend/
          cp frontend/rl-app/src/app/features/admin/matrices-riesgos/pages/matrices-riesgos/matrices-riesgos.component.html fase12_3_fuentes/frontend/
          cp frontend/rl-app/src/app/features/admin/matrices-riesgos/pages/matrices-riesgos/matrices-riesgos.component.spec.ts fase12_3_fuentes/frontend/

      - name: Publicar inventario
        uses: actions/upload-artifact@v4
        with:
          name: fase12-3-inventario-${{ github.run_id }}
          path: |
            fase12_3_archivos.txt
            fase12_3_coincidencias.txt
            fase12_3_esquema_oracle.txt
            fase12_3_fuentes/
          retention-days: 3

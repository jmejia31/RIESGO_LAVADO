name: Fase 12.4 Integracion robusta

on:
  pull_request:
    branches: [fase-12-mejora-ejecutiva-matrices]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fase12-4-integracion-robusta
  cancel-in-progress: false

jobs:
  integrar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout rama objetivo
        uses: actions/checkout@v4
        with:
          ref: fase-12-mejora-ejecutiva-matrices
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/rl-app/package-lock.json

      - name: Restore backend
        run: dotnet restore RIESGO_LAVADO.sln

      - name: Install frontend dependencies
        working-directory: frontend/rl-app
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend/rl-app
        run: npx playwright install --with-deps chromium

      - name: Aplicar integración
        run: |
          python3 tools/fase12_4_integrar.py
          python3 tools/fase12_4_corregir_prueba_html.py

      - name: Ejecutar quality gates completos
        shell: pwsh
        run: |
          & ./tools/run_quality_gates.ps1 *>&1 | Tee-Object -FilePath fase12_4_quality_gates.log
          exit $LASTEXITCODE

      - name: Conservar evidencia de ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase12-4-quality-gates
          path: fase12_4_quality_gates.log
          if-no-files-found: warn
          retention-days: 7

      - name: Publicar rama limpia
        run: |
          rm -f .github/workflows/fase12-4-integracion.yml
          rm -f .github/workflows/fase12-4-integracion-v2.yml
          rm -f tools/fase12_4_integrar.py
          rm -f tools/fase12_4_corregir_prueba_html.py
          rm -f tools/fase12_4_trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(matrices): alinea reportería y exportaciones fase 12.4"
          git pull --rebase origin fase-12-mejora-ejecutiva-matrices
          git push origin HEAD:fase-12-mejora-ejecutiva-matrices

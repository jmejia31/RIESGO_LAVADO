name: One-time FE01 Signals Migration

on:
  push:
    branches: [desarrollo]
    paths:
      - '.github/workflows/one-time-fe01-signals.yml'

permissions:
  contents: write

jobs:
  migrate-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout desarrollo
        uses: actions/checkout@v4
        with:
          ref: desarrollo
          fetch-depth: 1

      - name: Apply FE-01 gradual Signals migration
        shell: python
        run: |
          from pathlib import Path

          def one(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: patrón no único ({text.count(old)}): {old[:80]}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def exact(path, old, new, expected):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != expected:
                  raise SystemExit(f'{path}: esperado {expected}, encontrado {text.count(old)}: {old[:80]}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          targets = [
              'frontend/rl-app/src/app/app.ts',
              'frontend/rl-app/src/app/shared/layout/main-layout/main-layout.component.ts',
              'frontend/rl-app/src/app/shared/pages/sin-acceso/sin-acceso.component.ts',
              'frontend/rl-app/src/app/features/admin/configuracion/pages/configuracion/configuracion.component.ts',
              'frontend/rl-app/src/app/features/admin/bitacora/pages/bitacora/bitacora.component.ts',
              'frontend/rl-app/src/app/features/auth/pages/login/login.component.ts',
              'frontend/rl-app/src/app/features/admin/listas/pages/cargar-listas/cargar-listas.component.ts',
          ]
          for path in targets:
              one(path, 'ChangeDetectionStrategy.Eager', 'ChangeDetectionStrategy.OnPush')

          login = 'frontend/rl-app/src/app/features/auth/pages/login/login.component.ts'
          one(login,
              "import { ChangeDetectionStrategy, Component, signal, OnInit, OnDestroy, inject } from '@angular/core';",
              "import { ChangeDetectionStrategy, Component, computed, signal, OnInit, OnDestroy, inject } from '@angular/core';")
          one(login,
              "import { ConfiguracionService } from '../../../../core/configuration/configuracion.service';",
              "import { ConfiguracionService } from '../../../../core/configuration/configuracion.service';\nimport { LoginSlide } from '../../../../core/configuration/configuracion.models';")
          one(login,
              "  // Carrusel\n  slideActual = signal(0);\n  intervalo: any;\n  slides: any[] = [];",
              "  // Carrusel: estado de presentación local gestionado con Signals.\n  readonly slideActual = signal(0);\n  readonly slides = signal<LoginSlide[]>([]);\n  readonly slideSeleccionado = computed(() => {\n    const items = this.slides();\n    if (items.length === 0) return null;\n    return items[Math.min(this.slideActual(), items.length - 1)] ?? null;\n  });\n  private intervalo: ReturnType<typeof setInterval> | null = null;")
          one(login,
              "        this.slides = data;\n        if (this.slides.length > 0) this.iniciarCarrusel();",
              "        this.slides.set(data);\n        this.ajustarSlideActual();\n        if (data.length > 1) this.iniciarCarrusel();")
          one(login, "        this.slides = [", "        this.slides.set([")
          one(login,
              "          { id: 3, imagenUrl: 'assets/login/slide3.png', titulo: 'Cumplimiento Normativo IHSS', descripcion: 'Alineación institucional con regulaciones de transparencia y control interno.', orden: 3, activo: true }\n        ];",
              "          { id: 3, imagenUrl: 'assets/login/slide3.png', titulo: 'Cumplimiento Normativo IHSS', descripcion: 'Alineación institucional con regulaciones de transparencia y control interno.', orden: 3, activo: true }\n        ]);\n        this.ajustarSlideActual();")
          one(login,
              "  ngOnDestroy(): void {\n    if (this.intervalo) clearInterval(this.intervalo);\n  }\n\n  iniciarCarrusel() {\n    this.intervalo = setInterval(() => {\n      this.slideActual.update(val => (val + 1) % this.slides.length);\n    }, 5000);\n  }\n\n  seleccionarSlide(idx: number) {\n    this.slideActual.set(idx);\n    if (this.intervalo) {\n      clearInterval(this.intervalo);\n      this.iniciarCarrusel();\n    }\n  }",
              "  ngOnDestroy(): void {\n    if (this.intervalo) {\n      clearInterval(this.intervalo);\n      this.intervalo = null;\n    }\n  }\n\n  iniciarCarrusel(): void {\n    if (this.intervalo) clearInterval(this.intervalo);\n    if (this.slides().length <= 1) {\n      this.intervalo = null;\n      return;\n    }\n    this.intervalo = setInterval(() => {\n      const total = this.slides().length;\n      if (total > 1) this.slideActual.update(val => (val + 1) % total);\n    }, 5000);\n  }\n\n  seleccionarSlide(idx: number): void {\n    if (idx < 0 || idx >= this.slides().length) return;\n    this.slideActual.set(idx);\n    this.iniciarCarrusel();\n  }\n\n  private ajustarSlideActual(): void {\n    const total = this.slides().length;\n    if (total === 0) {\n      this.slideActual.set(0);\n      return;\n    }\n    if (this.slideActual() >= total) this.slideActual.set(total - 1);\n  }")

          login_html = 'frontend/rl-app/src/app/features/auth/pages/login/login.component.html'
          one(login_html, '@for (slide of slides; track $index)', '@for (slide of slides(); track slide.id)')
          one(login_html, '@if (slides.length > 0)', '@if (slideSeleccionado())')
          one(login_html, '{{ slides[slideActual()]?.titulo }}', '{{ slideSeleccionado()?.titulo }}')
          one(login_html, '{{ slides[slideActual()]?.descripcion }}', '{{ slideSeleccionado()?.descripcion }}')
          one(login_html, '@for (s of slides; track $index)', '@for (s of slides(); track s.id)')

          cargar = 'frontend/rl-app/src/app/features/admin/listas/pages/cargar-listas/cargar-listas.component.ts'
          one(cargar, '  archivoSeleccionado: File | null = null;', '  readonly archivoSeleccionado = signal<File | null>(null);')
          exact(cargar, 'this.archivoSeleccionado = null;', 'this.archivoSeleccionado.set(null);', 3)
          one(cargar, '    this.archivoSeleccionado = file;', '    this.archivoSeleccionado.set(file);')
          one(cargar,
              "    if (!this.archivoSeleccionado) {\n      import('sweetalert2').then((Swal) => {",
              "    const archivoSeleccionado = this.archivoSeleccionado();\n    if (!archivoSeleccionado) {\n      import('sweetalert2').then((Swal) => {")
          one(cargar,
              '      this.listasService.uploadListaCautela(this.archivoSeleccionado!, tipoListaId).subscribe({',
              '      this.listasService.uploadListaCautela(archivoSeleccionado, tipoListaId).subscribe({')

          cargar_html = 'frontend/rl-app/src/app/features/admin/listas/pages/cargar-listas/cargar-listas.component.html'
          one(cargar_html, '!archivoSeleccionado"', '!archivoSeleccionado()"')

      - name: Build frontend after migration
        working-directory: frontend/rl-app
        shell: bash
        run: |
          npm ci
          npm run build

      - name: Commit FE-01 technical migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/rl-app/src/app
          git diff --cached --quiet && exit 0
          git commit -m "refactor(frontend): adoptar Signals gradualmente FE-01"
          git push origin HEAD:desarrollo

name: Fase 12.5.3 Reemplazo Reportería Matrices

on:
  pull_request:
    branches: [fase-12-mejora-ejecutiva-matrices]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fase12-5-3-reporteria-matrices
  cancel-in-progress: false

jobs:
  reemplazar-validar-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout rama técnica
        uses: actions/checkout@v4
        with:
          ref: fase-12-5-3-reporteria-matrices-ejecucion
          fetch-depth: 0

      - name: Aplicar reemplazo de reportería
        id: transformacion
        continue-on-error: true
        shell: bash
        run: python tools/fase12_5_3_reemplazar_reporteria_matrices.py > fase12_5_3_transformacion.log 2>&1

      - name: Publicar diagnóstico de transformación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase12-5-3-transformacion
          path: fase12_5_3_transformacion.log
          if-no-files-found: error

      - name: Detener si la transformación falló
        if: steps.transformacion.outcome != 'success'
        run: exit 1

      - name: Verificar arquitectura documental
        shell: bash
        run: |
          grep -q 'InstitutionalPdfDocument' backend/RL.API/Features/MatricesRiesgos/Application/MatricesRiesgosReportRenderer.cs
          grep -q 'InstitutionalXlsxWorkbook' backend/RL.API/Features/MatricesRiesgos/Application/MatricesRiesgosReportRenderer.cs
          grep -q 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' backend/RL.API/Features/MatricesRiesgos/Application/MatricesRiesgosReportRenderer.cs
          grep -q 'reportes/ficha' backend/RL.API/Features/MatricesRiesgos/MatricesRiesgosController.cs
          grep -q 'ExportarFichaAsync' backend/RL.API/Features/MatricesRiesgos/Application/IMatricesRiesgosAppService.cs
          ! grep -q 'application/vnd.ms-excel' backend/RL.API/Features/MatricesRiesgos/Application/MatricesRiesgosAppService.cs
          ! grep -q 'CrearPdfSimple' backend/RL.API/Features/MatricesRiesgos/Application/MatricesRiesgosAppService.cs
          ! grep -q "from 'jspdf'" frontend/rl-app/src/app/features/admin/matrices-riesgos/pages/matrices-riesgos/matrices-riesgos.component.ts
          ! grep -q "from 'jspdf-autotable'" frontend/rl-app/src/app/features/admin/matrices-riesgos/pages/matrices-riesgos/matrices-riesgos.component.ts
          ! grep -q " : 'xls'" frontend/rl-app/src/app/features/admin/matrices-riesgos/pages/matrices-riesgos/matrices-riesgos.component.ts
          grep -q 'exportarFicha' frontend/rl-app/src/app/features/admin/matrices-riesgos/data-access/matrices-riesgos.service.ts

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/rl-app/package-lock.json

      - name: Restore backend
        run: dotnet restore RIESGO_LAVADO.sln

      - name: Instalar frontend
        working-directory: frontend/rl-app
        run: npm ci

      - name: Instalar Playwright Chromium
        working-directory: frontend/rl-app
        run: npx playwright install --with-deps chromium

      - name: Ejecutar Quality Gates completos
        id: quality
        continue-on-error: true
        shell: pwsh
        run: ./tools/run_quality_gates.ps1 *> fase12_5_3_quality.log

      - name: Publicar diagnóstico técnico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase12-5-3-diagnostico
          path: |
            fase12_5_3_quality.log
            docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor/Evidencia_Fase_12_5_3/fase12_5_3_reemplazo_reporteria_matrices.json
          if-no-files-found: warn

      - name: Detener si Quality Gates fallaron
        if: steps.quality.outcome != 'success'
        run: exit 1

      - name: Registrar validación aprobada
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor/Evidencia_Fase_12_5_3/fase12_5_3_reemplazo_reporteria_matrices.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['estado'] = 'validado_ci'
          data['ejecucion_controlada'] = {'run_id': int(os.environ['GITHUB_RUN_ID']), 'resultado': 'success'}
          data['quality_gates'] = {'backend': 'aprobado', 'frontend': 'aprobado', 'build_angular': 'aprobado', 'e2e': 'aprobado'}
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Publicar commit limpio
        shell: bash
        run: |
          rm -f fase12_5_3_transformacion.log fase12_5_3_quality.log
          rm -rf tools/fase12_5_3_payload
          rm -f tools/fase12_5_3_reemplazar_reporteria_matrices.py
          rm -f .github/workflows/fase12-5-3-reporteria-matrices.yml
          rm -f "docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor/Evidencia_Fase_12_5_3/ACTIVAR"*.tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(reporteria): reemplaza reportería de Matrices fase 12.5.3"
          git pull --rebase origin fase-12-mejora-ejecutiva-matrices
          git push origin HEAD:fase-12-mejora-ejecutiva-matrices

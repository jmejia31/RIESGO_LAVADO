name: One-time FE01 Governance

on:
  push:
    branches: [desarrollo]
    paths:
      - '.github/workflows/one-time-fe01-governance.yml'

permissions:
  contents: write

jobs:
  append-fe01:
    name: Append FE-01 immutable correction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout desarrollo
        uses: actions/checkout@v4
        with:
          ref: desarrollo
          fetch-depth: 1

      - name: Append FE-01 correction only
        shell: bash
        run: |
          echo '' | base64 --decode >> BITACORA_COLABORACION.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BITACORA_COLABORACION.md
          git diff --cached --quiet && exit 0
          git commit -m "docs(governance): corregir FE-01 append-only"
          git push origin HEAD:desarrollo

name: Fase 12.3 Integracion

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fase12-3-integracion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrar-validar:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout rama
        uses: actions/checkout@v4
        with:
          ref: fase-12-mejora-ejecutiva-matrices
          fetch-depth: 0

      - name: Aplicar backend y contratos
        run: |
          python tools/fase12_3_backend_core.py
          python tools/fase12_3_repository.py
          python tools/fase12_3_backend_tests.py

      - name: Aplicar frontend y evidencia
        run: |
          python tools/fase12_3_frontend_contracts.py
          python tools/fase12_3_frontend_component.py
          python tools/fase12_3_frontend_html.py
          python tools/fase12_3_frontend_tests_evidence.py

      - name: Verificar integracion funcional
        shell: bash
        run: |
          repo="backend/RL.API/Features/MatricesRiesgos/Persistence/MatricesRiesgosRepository.cs"
          componente="frontend/rl-app/src/app/features/admin/matrices-riesgos/pages/matrices-riesgos/matrices-riesgos.component.ts"
          plantilla="frontend/rl-app/src/app/features/admin/matrices-riesgos/pages/matrices-riesgos/matrices-riesgos.component.html"
          grep -q "ObtenerMapaTransicionDashboardAsync" "$repo"
          grep -q "RL_MR_RESULTADOS" "$repo"
          grep -q "mapaTransicion" "$componente"
          grep -q "Mapa de transición de riesgo" "$plantilla"
          ! grep -q "Frecuente" "$plantilla"
          ! grep -q "Probabilidad" "$plantilla"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar backend
        id: backend_restore
        shell: bash
        env:
          NUGET_CERT_REVOCATION_MODE: offline
        run: |
          set +e
          dotnet restore backend/RL.API.Tests/RL.API.Tests.csproj --disable-parallel --force-evaluate > "$GITHUB_WORKSPACE/fase12_3_backend_restore.txt" 2>&1
          codigo=$?
          echo "exit_code=$codigo" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Probar backend
        id: backend_tests
        shell: bash
        run: |
          set +e
          if [ "${{ steps.backend_restore.outputs.exit_code }}" = "0" ]; then
            dotnet test backend/RL.API.Tests/RL.API.Tests.csproj --configuration Release --no-restore > "$GITHUB_WORKSPACE/fase12_3_backend_tests.txt" 2>&1
            codigo=$?
          else
            echo "Pruebas no ejecutadas porque NuGet restore no finalizó." > "$GITHUB_WORKSPACE/fase12_3_backend_tests.txt"
            codigo=99
          fi
          echo "exit_code=$codigo" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/rl-app/package-lock.json

      - name: Instalar frontend
        working-directory: frontend/rl-app
        run: npm ci

      - name: Probar frontend
        id: frontend_tests
        working-directory: frontend/rl-app
        shell: bash
        run: |
          set +e
          npm run test:coverage > "$GITHUB_WORKSPACE/fase12_3_frontend_tests.txt" 2>&1
          codigo=$?
          echo "exit_code=$codigo" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Compilar Angular
        id: angular_build
        working-directory: frontend/rl-app
        shell: bash
        run: |
          set +e
          npm run build > "$GITHUB_WORKSPACE/fase12_3_angular_build.txt" 2>&1
          codigo=$?
          echo "exit_code=$codigo" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generar evidencia de validacion
        shell: python
        env:
          RESTORE_EXIT_CODE: ${{ steps.backend_restore.outputs.exit_code }}
          BACKEND_EXIT_CODE: ${{ steps.backend_tests.outputs.exit_code }}
          FRONTEND_EXIT_CODE: ${{ steps.frontend_tests.outputs.exit_code }}
          BUILD_EXIT_CODE: ${{ steps.angular_build.outputs.exit_code }}
        run: |
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          base = Path('docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor/Evidencia_Fase_12_3')
          base.mkdir(parents=True, exist_ok=True)
          restore_ok = os.environ.get('RESTORE_EXIT_CODE') == '0'
          backend_ok = os.environ.get('BACKEND_EXIT_CODE') == '0'
          frontend_ok = os.environ.get('FRONTEND_EXIT_CODE') == '0'
          build_ok = os.environ.get('BUILD_EXIT_CODE') == '0'

          def leer(nombre):
              ruta = Path(nombre)
              return ruta.read_text(encoding='utf-8', errors='replace') if ruta.exists() else ''

          backend_log = leer('fase12_3_backend_tests.txt')
          frontend_log = leer('fase12_3_frontend_tests.txt')
          backend_match = re.search(r'(\d+)\s+passed', backend_log, re.IGNORECASE)
          frontend_match = re.search(r'Tests\s+(\d+)\s+passed', frontend_log, re.IGNORECASE)

          resultado = {
              'fase': '12.3 - Dashboard ejecutivo y mapa de calor',
              'fecha': datetime.now(timezone.utc).isoformat(),
              'rama': 'fase-12-mejora-ejecutiva-matrices',
              'fuente_datos': 'Oracle mediante backend .NET',
              'mapa_calor_tipo': 'Transición inherente a residual',
              'datos_reales': True,
              'datos_quemados': False,
              'filtros_backend': True,
              'celdas_interactivas': True,
              'restore_backend': 'Aprobado' if restore_ok else 'Fallido',
              'backend': {
                  'resultado': 'Aprobado' if backend_ok else 'Fallido',
                  'pruebas_aprobadas_detectadas': int(backend_match.group(1)) if backend_match else None,
              },
              'frontend': {
                  'resultado': 'Aprobado' if frontend_ok else 'Fallido',
                  'pruebas_aprobadas_detectadas': int(frontend_match.group(1)) if frontend_match else None,
              },
              'build_angular': 'Aprobado' if build_ok else 'Fallido',
              'resultado_general': 'Correcto' if restore_ok and backend_ok and frontend_ok and build_ok else 'Requiere corrección',
          }
          (base / 'fase12_3_validacion_automatizada.json').write_text(
              json.dumps(resultado, ensure_ascii=False, indent=2), encoding='utf-8'
          )

      - name: Publicar artefacto de diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase12-3-validacion-${{ github.run_id }}
          path: |
            fase12_3_backend_restore.txt
            fase12_3_backend_tests.txt
            fase12_3_frontend_tests.txt
            fase12_3_angular_build.txt
            docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor/Evidencia_Fase_12_3/
          if-no-files-found: warn
          retention-days: 7

      - name: Validar resultados antes de publicar
        shell: bash
        run: |
          echo "restore=${{ steps.backend_restore.outputs.exit_code }}"
          echo "backend=${{ steps.backend_tests.outputs.exit_code }}"
          echo "frontend=${{ steps.frontend_tests.outputs.exit_code }}"
          echo "build=${{ steps.angular_build.outputs.exit_code }}"
          test "${{ steps.backend_restore.outputs.exit_code }}" = "0"
          test "${{ steps.backend_tests.outputs.exit_code }}" = "0"
          test "${{ steps.frontend_tests.outputs.exit_code }}" = "0"
          test "${{ steps.angular_build.outputs.exit_code }}" = "0"

      - name: Publicar commit atomico en rama
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: fase-12-mejora-ejecutiva-matrices
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, os, subprocess, urllib.error, urllib.parse, urllib.request
          repo=os.environ['REPOSITORY']; token=os.environ['GITHUB_TOKEN']; branch=os.environ['TARGET_BRANCH']; api='https://api.github.com'
          def request(method, endpoint, payload=None):
              data=None if payload is None else json.dumps(payload).encode('utf-8')
              req=urllib.request.Request(f'{api}{endpoint}',data=data,method=method,headers={
                  'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req) as response: return json.loads(response.read().decode('utf-8'))
              except urllib.error.HTTPError as exc:
                  raise RuntimeError(exc.read().decode('utf-8',errors='replace')) from exc
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          untracked=subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines()
          allowed=('backend/RL.API/','backend/RL.API.Tests/','frontend/rl-app/src/app/features/admin/matrices-riesgos/',
                   'docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor/Evidencia_Fase_12_3/')
          files=sorted({p for p in changed+untracked if p.startswith(allowed)})
          if not files: raise SystemExit(0)
          encoded_branch=urllib.parse.quote(branch,safe='')
          ref=request('GET',f'/repos/{repo}/git/ref/heads/{encoded_branch}')
          parent=ref['object']['sha']; base_tree=request('GET',f'/repos/{repo}/git/commits/{parent}')['tree']['sha']
          entries=[]
          for file_path in files:
              encoded=base64.b64encode(open(file_path,'rb').read()).decode('ascii')
              blob=request('POST',f'/repos/{repo}/git/blobs',{'content':encoded,'encoding':'base64'})
              entries.append({'path':file_path,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=request('POST',f'/repos/{repo}/git/trees',{'base_tree':base_tree,'tree':entries})
          commit=request('POST',f'/repos/{repo}/git/commits',{'message':'feat(matrices): implementa dashboard ejecutivo y mapa funcional fase 12.3','tree':tree['sha'],'parents':[parent]})
          request('PATCH',f'/repos/{repo}/git/refs/heads/{encoded_branch}',{'sha':commit['sha'],'force':False})
          print(commit['sha'])
          PY

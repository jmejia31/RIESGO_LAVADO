name: Phase 7 normalize validator exit

on:
  push:
    branches:
      - desarrollo

permissions:
  contents: write

jobs:
  normalize-validator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout desarrollo
        uses: actions/checkout@v4
        with:
          ref: desarrollo
          fetch-depth: 0

      - name: Normalize validator exit
        run: python scripts/maintenance/apply_phase7_validator_exit.py

      - name: Commit validator exit normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(matrices): normalizar salida exitosa del validador"
          git push origin HEAD:desarrollo

name: Fase 12.5.4 Refinamiento UX y Técnico

on:
  pull_request:
    branches: [fase-12-mejora-ejecutiva-matrices]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fase12-5-4-refinamiento
  cancel-in-progress: false

jobs:
  refinar-validar-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout rama técnica
        uses: actions/checkout@v4
        with:
          ref: fase-12-5-4-refinamiento-ejecucion
          fetch-depth: 0

      - name: Corregir verificación de ruta retirada
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/fase12_5_4_aplicar.py')
          text = p.read_text(encoding='utf-8')
          old = '"controller_endpoint_removed": "/recalcular" not in (ROOT / "backend/RL.API/Features/MatricesRiesgos/MatricesRiesgosController.cs").read_text(encoding="utf-8"),'
          new = '"controller_endpoint_removed": \'[HttpPost("{id:long}/recalcular")]\' not in (ROOT / "backend/RL.API/Features/MatricesRiesgos/MatricesRiesgosController.cs").read_text(encoding="utf-8"),'
          if old not in text:
              raise SystemExit('No se encontró la verificación original.')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Ejecutar inventario técnico
        run: python tools/fase12_5_4_diagnostico.py

      - name: Aplicar refinamiento
        id: transformacion
        continue-on-error: true
        run: python tools/fase12_5_4_aplicar.py > fase12_5_4_transformacion.log 2>&1

      - name: Publicar diagnóstico de transformación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase12-5-4-transformacion
          path: |
            fase12_5_4_transformacion.log
            docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor/Evidencia_Fase_12_5_4/fase12_5_4_diagnostico.json
            docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor/Evidencia_Fase_12_5_4/fase12_5_4_refinamiento.json
            docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor/Evidencia_Fase_12_5_4/DECISION_TECNICA_FASE_12_5_4.md
          if-no-files-found: warn

      - name: Detener si la transformación falló
        if: steps.transformacion.outcome != 'success'
        run: exit 1

      - name: Verificar arquitectura y restricciones
        shell: bash
        run: |
          ! grep -q 'HttpPost("{id:long}/recalcular")' backend/RL.API/Features/MatricesRiesgos/MatricesRiesgosController.cs
          ! grep -q 'recalcular(id:' frontend/rl-app/src/app/features/admin/matrices-riesgos/data-access/matrices-riesgos.service.ts
          grep -q 'this.service.calcular(matriz.matrizId, tipoCalculo)' frontend/rl-app/src/app/features/admin/matrices-riesgos/pages/matrices-riesgos/matrices-riesgos.component.ts
          grep -q 'readonly exportando' frontend/rl-app/src/app/features/admin/matrices-riesgos/pages/matrices-riesgos/matrices-riesgos.component.ts
          grep -q 'aria-modal="true"' frontend/rl-app/src/app/features/admin/matrices-riesgos/pages/matrices-riesgos/matrices-riesgos.component.html
          grep -q 'aria-live="assertive"' frontend/rl-app/src/app/features/admin/matrices-riesgos/pages/matrices-riesgos/matrices-riesgos.component.html
          grep -q 'm\\u00c3\\u00b3dulo' tools/polish_repository_policy_doc.py
          ! git diff --name-only fase-12-mejora-ejecutiva-matrices...HEAD | grep -q '^backend/RL.API/Features/Dnp/'
          ! git diff --name-only fase-12-mejora-ejecutiva-matrices...HEAD | grep -q 'CONTROL_ALMACEN.PROVEEDOR'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/rl-app/package-lock.json

      - name: Restore backend
        run: dotnet restore RIESGO_LAVADO.sln

      - name: Instalar frontend
        working-directory: frontend/rl-app
        run: npm ci

      - name: Instalar Playwright Chromium
        working-directory: frontend/rl-app
        run: npx playwright install --with-deps chromium

      - name: Ejecutar Quality Gates completos
        id: quality
        continue-on-error: true
        shell: pwsh
        run: ./tools/run_quality_gates.ps1 *> fase12_5_4_quality.log

      - name: Publicar diagnóstico técnico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase12-5-4-quality
          path: |
            fase12_5_4_quality.log
            docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor/Evidencia_Fase_12_5_4/fase12_5_4_refinamiento.json
          if-no-files-found: warn

      - name: Detener si Quality Gates fallaron
        if: steps.quality.outcome != 'success'
        run: exit 1

      - name: Registrar validación aprobada
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor/Evidencia_Fase_12_5_4/fase12_5_4_refinamiento.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['estado'] = 'validado_ci'
          data['ejecucion_controlada'] = {'run_id': int(os.environ['GITHUB_RUN_ID']), 'resultado': 'success'}
          data['quality_gates'] = {'backend': 'aprobado', 'frontend': 'aprobado', 'build_angular': 'aprobado', 'e2e': 'aprobado'}
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Publicar commit limpio
        shell: bash
        run: |
          rm -f fase12_5_4_transformacion.log fase12_5_4_quality.log
          rm -f tools/fase12_5_4_diagnostico.py tools/fase12_5_4_aplicar.py
          rm -f .github/workflows/fase12-5-4-ejecucion.yml
          rm -f "docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor/Evidencia_Fase_12_5_4/fase12_5_4_diagnostico.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(matrices): completa refinamiento fase 12.5.4"
          git pull --rebase origin fase-12-mejora-ejecutiva-matrices
          git push origin HEAD:fase-12-mejora-ejecutiva-matrices

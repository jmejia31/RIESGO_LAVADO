name: Corrección controlada Matrices Fase 1

on:
  push:
    branches:
      - desarrollo
    paths:
      - '.github/workflows/agent-fix-matrices-phase1.yml'

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: desarrollo
          fetch-depth: 0

      - name: Aplicar alineación técnica con DDL dinámico
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          repo_path = Path('backend/RL.API/Features/MatricesRiesgos/Persistence/MatricesRiesgosRepository.cs')
          text = repo_path.read_text(encoding='utf-8')
          original = text

          def required_replace(old: str, new: str, count: int = -1) -> None:
              global text
              occurrences = text.count(old)
              if occurrences == 0:
                  raise SystemExit(f'Patrón obligatorio no encontrado: {old[:120]!r}')
              if count == -1:
                  text = text.replace(old, new)
              else:
                  text = text.replace(old, new, count)

          # Flujo definitivo: una sola columna FLU_ESTADO.
          text = text.replace('FLU_ESTADO_NUEVO', 'FLU_ESTADO')
          text = text.replace('FLU_ESTADO_ANTERIOR, ', '')
          text = text.replace("NULL, 'BORRADOR', SYSDATE, :usuarioId", "'BORRADOR', SYSDATE, :usuarioId")
          text = text.replace(':anterior, :nuevo, :motivo, SYSDATE, :usuarioId', ':nuevo, :motivo, SYSDATE, :usuarioId')
          text = re.sub(r'^\s*cmdFlujo\.Parameters\.Add\(new OracleParameter\("anterior",\s*estadoAnterior\)\);\s*\n', '', text, flags=re.MULTILINE)

          # Lecturas: los cálculos proceden de la proyección y los metadatos físicos del DDL.
          old_select = '''e.EVA_DATA_CALC_JSON, e.EVA_VRI, e.EVA_ETP, e.EVA_VRR, e.EVA_FECHA_EVAL, 
                   e.EVA_USR_EVAL, e.EVA_VERSION_ROW, e.EVA_ACTIVO'''
          new_select = '''e.EVA_DATA_CALC_JSON, p.PROY_VRI AS EVA_VRI, 0 AS EVA_ETP, p.PROY_VRR AS EVA_VRR, e.EVA_FECHA_REGISTRO AS EVA_FECHA_EVAL, 
                   e.EVA_USR_REGISTRO AS EVA_USR_EVAL, e.EVA_VERSION_ROW, e.EVA_ACTIVO'''
          required_replace(old_select, new_select)

          first_from = '''              FROM RL_MR_EVALUACIONES_RIESGO e
              LEFT JOIN ('''
          first_joined = '''              FROM RL_MR_EVALUACIONES_RIESGO e
              LEFT JOIN RL_MR_PROYECCIONES_EVALUACION p ON e.EVA_ID = p.PROY_EVALUACION_ID
              LEFT JOIN ('''
          required_replace(first_from, first_joined, 1)

          # Creación de evaluación: eliminar columnas inexistentes del DDL.
          old_insert_cols = '''EVA_ID, EVA_RIESGO_ID, EVA_VERSION_ID, EVA_DATA_JSON, 
                    EVA_DATA_CALC_JSON, EVA_VRI, EVA_ETP, EVA_VRR, EVA_FECHA_EVAL, 
                    EVA_USR_EVAL, EVA_VERSION_ROW, EVA_ACTIVO'''
          new_insert_cols = '''EVA_ID, EVA_RIESGO_ID, EVA_VERSION_ID, EVA_DATA_JSON, 
                    EVA_DATA_CALC_JSON, EVA_FECHA_REGISTRO, 
                    EVA_USR_REGISTRO, EVA_VERSION_ROW, EVA_ACTIVO'''
          required_replace(old_insert_cols, new_insert_cols)

          old_insert_vals = ''':evaId, :riesgoId, :versionId, :dataJson, 
                    :dataCalcJson, :vri, :etp, :vrr, SYSDATE, 
                    :usuarioId, 1, 1'''
          new_insert_vals = ''':evaId, :riesgoId, :versionId, :dataJson, 
                    :dataCalcJson, SYSDATE, 
                    :usuarioId, 1, 1'''
          required_replace(old_insert_vals, new_insert_vals)
          text = re.sub(r'^\s*cmdInsert\.Parameters\.Add\(new OracleParameter\("(?:vri|etp|vrr)".*\);\s*\n', '', text, flags=re.MULTILINE)

          # Actualización: conservar datos dinámicos y control optimista; no escribir columnas inexistentes.
          old_update = '''                UPDATE RL_MR_EVALUACIONES_RIESGO
                   SET EVA_DATA_JSON = :dataJson,
                       EVA_DATA_CALC_JSON = :dataCalcJson,
                       EVA_VRI = :vri,
                       EVA_ETP = :etp,
                       EVA_VRR = :vrr,
                       EVA_FECHA_EVAL = SYSDATE,
                       EVA_USR_EVAL = :usuarioId,
                       EVA_VERSION_ROW = :nuevaVersionRow'''
          new_update = '''                UPDATE RL_MR_EVALUACIONES_RIESGO
                   SET EVA_DATA_JSON = :dataJson,
                       EVA_DATA_CALC_JSON = :dataCalcJson,
                       EVA_VERSION_ROW = :nuevaVersionRow'''
          required_replace(old_update, new_update)
          text = re.sub(r'^\s*cmdUpdate\.Parameters\.Add\(new OracleParameter\("(?:vri|etp|vrr|usuarioId)".*\);\s*\n', '', text, flags=re.MULTILINE)

          # Niveles y respuesta: provienen de datos/calculados versionados, no de rangos rígidos en C#.
          dynamic_projection = '''            var calc = MapearDiccionario(dto.EvaDataCalcJson ?? string.Empty);
            string respuesta = ObtenerValorTexto(answers, calc, "respuesta_riesgo", "PENDIENTE");
            string nivelInherente = ObtenerValorTexto(answers, calc, "nivel_inherente", null);
            string nivelResidual = ObtenerValorTexto(answers, calc, "nivel_residual", null);
            ValidarProyeccion(dto.EvaVri, dto.EvaVrr, nivelInherente, nivelResidual, area, due, respuesta);'''
          required_replace('            string nivel = DeterminarClasificacionResidual(dto.EvaVrr);', dynamic_projection)

          old_proj_insert = '''                INSERT INTO RL_MR_PROYECCIONES_EVALUACION (
                    PROY_ID, PROY_EVALUACION_ID, PROY_CODIGO_RIESGO, PROY_ESTADO_EVALUACION, 
                    PROY_VRI, PROY_ETP, PROY_VRR, PROY_NIVEL_RESIDUAL, 
                    PROY_AREA_PRINCIPAL, PROY_DUENO_RIESGO, PROY_FECHA_EVAL
                ) VALUES (
                    SEQ_RL_MR_PROYECCIONES.NEXTVAL, :evaId, :codigoRiesgo, 'BORRADOR',
                    :vri, :etp, :vrr, :nivel,
                    :area, :due, SYSDATE
                )";'''
          new_proj_insert = '''                INSERT INTO RL_MR_PROYECCIONES_EVALUACION (
                    PROY_ID, PROY_EVALUACION_ID, PROY_CODIGO_RIESGO,
                    PROY_AREA_PRINCIPAL, PROY_VRI, PROY_VRR,
                    PROY_NIVEL_INHERENTE, PROY_NIVEL_RESIDUAL,
                    PROY_RESPUESTA_RIESGO, PROY_ESTADO_EVALUACION,
                    PROY_DUENO_RIESGO, PROY_FECHA_EVAL
                ) VALUES (
                    SEQ_RL_MR_PROYECCIONES.NEXTVAL, :evaId, :codigoRiesgo,
                    :area, :vri, :vrr,
                    :nivelInherente, :nivelResidual,
                    :respuesta, 'BORRADOR',
                    :due, SYSDATE
                )";'''
          required_replace(old_proj_insert, new_proj_insert)

          text = re.sub(r'^\s*cmdProj\.Parameters\.Add\(new OracleParameter\("etp".*\);\s*\n', '', text, flags=re.MULTILINE)
          text = text.replace('cmdProj.Parameters.Add(new OracleParameter("nivel", nivel));',
                              'cmdProj.Parameters.Add(new OracleParameter("nivelInherente", nivelInherente));\n            cmdProj.Parameters.Add(new OracleParameter("nivelResidual", nivelResidual));\n            cmdProj.Parameters.Add(new OracleParameter("respuesta", respuesta));')

          old_proj_update = '''                   SET PROY_VRI = :vri,
                       PROY_ETP = :etp,
                       PROY_VRR = :vrr,
                       PROY_NIVEL_RESIDUAL = :nivel,
                       PROY_AREA_PRINCIPAL = :area,
                       PROY_DUENO_RIESGO = :due,
                       PROY_FECHA_EVAL = SYSDATE'''
          new_proj_update = '''                   SET PROY_VRI = :vri,
                       PROY_VRR = :vrr,
                       PROY_NIVEL_INHERENTE = :nivelInherente,
                       PROY_NIVEL_RESIDUAL = :nivelResidual,
                       PROY_RESPUESTA_RIESGO = :respuesta,
                       PROY_AREA_PRINCIPAL = :area,
                       PROY_DUENO_RIESGO = :due,
                       PROY_FECHA_EVAL = SYSDATE'''
          required_replace(old_proj_update, new_proj_update)

          # Consolidado transitorio: quitar PROY_ETP inexistente y exponer columnas físicas reales.
          old_cons_select = '''PROY_VRI, PROY_ETP, PROY_VRR, PROY_NIVEL_RESIDUAL, 
                   PROY_AREA_PRINCIPAL, PROY_DUENO_RIESGO, PROY_FECHA_EVAL'''
          new_cons_select = '''PROY_VRI, PROY_VRR, PROY_NIVEL_INHERENTE, PROY_NIVEL_RESIDUAL,
                   PROY_RESPUESTA_RIESGO, PROY_AREA_PRINCIPAL, PROY_DUENO_RIESGO, PROY_FECHA_EVAL'''
          required_replace(old_cons_select, new_cons_select)

          old_map = '''                { "Vri", reader.IsDBNull(3) ? 0 : reader.GetInt32(3) },
                { "Etp", reader.IsDBNull(4) ? 0m : reader.GetDecimal(4) },
                { "Vrr", reader.IsDBNull(5) ? 0 : reader.GetInt32(5) },
                { "NivelResidual", reader.IsDBNull(6) ? string.Empty : reader.GetString(6) },
                { "Area", reader.IsDBNull(7) ? string.Empty : reader.GetString(7) },
                { "Dueno", reader.IsDBNull(8) ? string.Empty : reader.GetString(8) },
                { "Fecha", reader.GetDateTime(9) }'''
          new_map = '''                { "Vri", reader.IsDBNull(3) ? 0 : reader.GetInt32(3) },
                { "Vrr", reader.IsDBNull(4) ? 0 : reader.GetInt32(4) },
                { "NivelInherente", reader.IsDBNull(5) ? string.Empty : reader.GetString(5) },
                { "NivelResidual", reader.IsDBNull(6) ? string.Empty : reader.GetString(6) },
                { "RespuestaRiesgo", reader.IsDBNull(7) ? string.Empty : reader.GetString(7) },
                { "Area", reader.IsDBNull(8) ? string.Empty : reader.GetString(8) },
                { "Dueno", reader.IsDBNull(9) ? string.Empty : reader.GetString(9) },
                { "Fecha", reader.GetDateTime(10) }'''
          required_replace(old_map, new_map)

          # Retirar clasificación rígida del repositorio.
          text, removed = re.subn(
              r'\n\s*private static string DeterminarClasificacionResidual\(int\? vrr\)\s*\{.*?\n\s*\}\n',
              '\n',
              text,
              count=1,
              flags=re.DOTALL,
          )
          if removed != 1:
              raise SystemExit('No se pudo retirar DeterminarClasificacionResidual.')

          helpers = r'''

    private static string ObtenerValorTexto(
        IReadOnlyDictionary<string, object> respuestas,
        IReadOnlyDictionary<string, object> calculados,
        string clave,
        string? valorPredeterminado)
    {
        if (calculados.TryGetValue(clave, out var calculado) && !string.IsNullOrWhiteSpace(calculado?.ToString()))
        {
            return calculado!.ToString()!;
        }

        if (respuestas.TryGetValue(clave, out var respuesta) && !string.IsNullOrWhiteSpace(respuesta?.ToString()))
        {
            return respuesta!.ToString()!;
        }

        return valorPredeterminado ?? string.Empty;
    }

    private static void ValidarProyeccion(
        int? vri,
        int? vrr,
        string nivelInherente,
        string nivelResidual,
        string area,
        string dueno,
        string respuesta)
    {
        if (!vri.HasValue || vri.Value < 1 || vri.Value > 9)
        {
            throw new InvalidOperationException("La proyección requiere un VRI válido dentro del dominio institucional 1–9.");
        }

        if (!vrr.HasValue || vrr.Value < 1 || vrr.Value > 9)
        {
            throw new InvalidOperationException("La proyección requiere un VRR válido dentro del dominio institucional 1–9.");
        }

        if (string.IsNullOrWhiteSpace(nivelInherente) || string.IsNullOrWhiteSpace(nivelResidual))
        {
            throw new InvalidOperationException("Los niveles inherente y residual deben proceder de la regla versionada aplicada.");
        }

        if (string.IsNullOrWhiteSpace(area) || string.IsNullOrWhiteSpace(dueno) || string.IsNullOrWhiteSpace(respuesta))
        {
            throw new InvalidOperationException("La proyección requiere área, dueño y respuesta al riesgo.");
        }
    }
'''
          head, sep, tail = text.rpartition('\n}')
          if not sep:
              raise SystemExit('No se encontró el cierre de MatricesRiesgosRepository.')
          text = head + helpers + '\n}' + tail

          forbidden = [
              'FLU_ESTADO_NUEVO', 'FLU_ESTADO_ANTERIOR',
              'EVA_VRI', 'EVA_ETP', 'EVA_VRR', 'EVA_FECHA_EVAL', 'EVA_USR_EVAL',
              'PROY_ETP', 'DeterminarClasificacionResidual'
          ]
          # Los alias EVA_* permanecen únicamente en SELECT para compatibilidad temporal del DTO.
          forbidden_physical = ['FLU_ESTADO_NUEVO', 'FLU_ESTADO_ANTERIOR', 'PROY_ETP', 'DeterminarClasificacionResidual']
          for token in forbidden_physical:
              if token in text:
                  raise SystemExit(f'Identificador prohibido aún presente: {token}')

          if text == original:
              raise SystemExit('No se aplicaron cambios al repositorio.')
          repo_path.write_text(text, encoding='utf-8')

          # Contratos neutros para la transición; se conectarán por fases sin reutilizar factores/variables.
          methodology = Path('backend/RL.API/Features/MatricesRiesgos/Contracts/Metodologia/MetodologiaFormularioDtos.cs')
          methodology.parent.mkdir(parents=True, exist_ok=True)
          methodology.write_text(r'''using System.Text.Json;

namespace RL.API.Features.MatricesRiesgos.Contracts;

public sealed class MetodologiaFormularioDto
{
    public long VersionFormularioId { get; set; }
    public string Codigo { get; set; } = string.Empty;
    public int Version { get; set; }
    public IReadOnlyList<SeccionFormularioDto> Secciones { get; set; } = Array.Empty<SeccionFormularioDto>();
    public IReadOnlyList<CatalogoMatricesDto> Catalogos { get; set; } = Array.Empty<CatalogoMatricesDto>();
    public IReadOnlyList<ReglaCalculoMatricesDto> Reglas { get; set; } = Array.Empty<ReglaCalculoMatricesDto>();
}

public sealed class SeccionFormularioDto
{
    public string Clave { get; set; } = string.Empty;
    public string Titulo { get; set; } = string.Empty;
    public int Orden { get; set; }
    public IReadOnlyList<CampoFormularioDto> Campos { get; set; } = Array.Empty<CampoFormularioDto>();
}

public sealed class CampoFormularioDto
{
    public long? CampoCanonicoId { get; set; }
    public string Clave { get; set; } = string.Empty;
    public string Etiqueta { get; set; } = string.Empty;
    public string Tipo { get; set; } = string.Empty;
    public string? CodigoCatalogo { get; set; }
    public bool Obligatorio { get; set; }
    public bool SoloLectura { get; set; }
}

public sealed class CatalogoMatricesDto
{
    public string Codigo { get; set; } = string.Empty;
    public string Nombre { get; set; } = string.Empty;
    public IReadOnlyList<ElementoCatalogoMatricesDto> Elementos { get; set; } = Array.Empty<ElementoCatalogoMatricesDto>();
}

public sealed class ElementoCatalogoMatricesDto
{
    public string Codigo { get; set; } = string.Empty;
    public string Valor { get; set; } = string.Empty;
    public int Orden { get; set; }
}

public sealed class ReglaCalculoMatricesDto
{
    public string Codigo { get; set; } = string.Empty;
    public string Version { get; set; } = string.Empty;
    public string AlgoritmoId { get; set; } = string.Empty;
    public JsonElement? Parametros { get; set; }
}
''', encoding='utf-8')

          reports = Path('backend/RL.API/Features/MatricesRiesgos/Contracts/Reportes/ReporteMatricesDtos.cs')
          reports.parent.mkdir(parents=True, exist_ok=True)
          reports.write_text(r'''namespace RL.API.Features.MatricesRiesgos.Contracts;

public sealed class RiesgoReporteFilaDto
{
    public long RiesgoId { get; set; }
    public long EvaluacionId { get; set; }
    public string CodigoRiesgo { get; set; } = string.Empty;
    public string AreaPrincipal { get; set; } = string.Empty;
    public string DuenoRiesgo { get; set; } = string.Empty;
    public int Vri { get; set; }
    public string NivelInherente { get; set; } = string.Empty;
    public int Vrr { get; set; }
    public string NivelResidual { get; set; } = string.Empty;
    public string RespuestaRiesgo { get; set; } = string.Empty;
    public string EstadoEvaluacion { get; set; } = string.Empty;
    public DateTime FechaEvaluacion { get; set; }
}

public sealed class ReporteMatricesPaginadoDto
{
    public IReadOnlyList<RiesgoReporteFilaDto> Items { get; set; } = Array.Empty<RiesgoReporteFilaDto>();
    public int Pagina { get; set; }
    public int TamanoPagina { get; set; }
    public int TotalRegistros { get; set; }
    public int TotalPaginas { get; set; }
    public ReporteMatricesTotalesDto Totales { get; set; } = new();
}

public sealed class ReporteMatricesTotalesDto
{
    public int TotalRiesgos { get; set; }
    public int TotalConEvaluacionOficial { get; set; }
    public int TotalSinEvaluacionOficial { get; set; }
    public int TotalAltoCritico { get; set; }
}

public sealed class MatrizRiesgoDashboardDinamicoDto
{
    public int TotalRiesgos { get; set; }
    public int TotalConEvaluacionOficial { get; set; }
    public int TotalSinEvaluacionOficial { get; set; }
    public IReadOnlyList<MapaTransicionCeldaDto> MapaTransicion { get; set; } = Array.Empty<MapaTransicionCeldaDto>();
    public IReadOnlyList<RiesgoReporteFilaDto> PendientesOperativos { get; set; } = Array.Empty<RiesgoReporteFilaDto>();
}

public sealed class MapaTransicionCeldaDto
{
    public int FrecuenciaInherente { get; set; }
    public int ImpactoInherente { get; set; }
    public int Total { get; set; }
    public string Nivel { get; set; } = string.Empty;
}
''', encoding='utf-8')

          validator = Path('scripts/validation/validate_matrices_dynamic_ddl_alignment.ps1')
          validator.parent.mkdir(parents=True, exist_ok=True)
          validator.write_text(r'''$ErrorActionPreference = 'Stop'

$repository = Join-Path $PSScriptRoot '../../backend/RL.API/Features/MatricesRiesgos/Persistence/MatricesRiesgosRepository.cs'
$content = Get-Content -LiteralPath $repository -Raw

$forbidden = @(
    'FLU_ESTADO_NUEVO',
    'FLU_ESTADO_ANTERIOR',
    'PROY_ETP',
    'DeterminarClasificacionResidual'
)

$errors = @()
foreach ($token in $forbidden) {
    if ($content.Contains($token)) {
        $errors += "Identificador incompatible con el DDL definitivo: $token"
    }
}

if ($errors.Count -gt 0) {
    $errors | ForEach-Object { Write-Error $_ }
    exit 1
}

Write-Host 'Alineación básica del repositorio de Matrices con el DDL dinámico: CORRECTA.'
''', encoding='utf-8')

          # Registrar el estado sin declarar cierre técnico.
          state = Path('docs/0.0 Documentación/ESTADO_COLABORACION.md')
          state_text = state.read_text(encoding='utf-8')
          marker = '## Intervención 2026-08-03 — Alineación dinámica Fase 1'
          if marker not in state_text:
              state_text += f'''\n\n{marker}\n\n- Rama: `desarrollo`.\n- Estado: Fase 1.1 iniciada; no cerrada.\n- Ejecutado: corrección controlada del script Oracle `05` y alineación base del repositorio con las columnas físicas de evaluaciones, flujos y proyecciones.\n- Incorporado: contratos neutros de metodología y reportes para sustituir gradualmente el modelo heredado.\n- Pendiente: revisión de Codex, integración Oracle real, metodología versionada, dashboard, reportes, exportaciones y frontend.\n- `main` permanece intacta.\n'''
              state.write_text(state_text, encoding='utf-8')

          bitacora = Path('BITACORA_COLABORACION.md')
          bit_text = bitacora.read_text(encoding='utf-8')
          if marker not in bit_text:
              bit_text += f'''\n\n{marker}\n\nSe inicia la ejecución controlada de la Fase 1 sobre `desarrollo`. Se corrigen identificadores incompatibles con el DDL definitivo (`FLU_ESTADO_NUEVO`, `FLU_ESTADO_ANTERIOR`, `PROY_ETP` y columnas de cálculo inexistentes en la evaluación), se elimina la clasificación rígida del repositorio y se incorporan contratos neutros para metodología y reportería. La intervención no declara el módulo terminado y queda sujeta a pruebas Oracle reales y revisión de Codex.\n'''
              bitacora.write_text(bit_text, encoding='utf-8')

          # El flujo es temporal y se retira en el mismo commit técnico.
          Path('.github/workflows/agent-fix-matrices-phase1.yml').unlink(missing_ok=True)
          PY

      - name: Validar identificadores físicos
        shell: pwsh
        run: ./scripts/validation/validate_matrices_dynamic_ddl_alignment.ps1

      - name: Ejecutar pruebas backend
        shell: bash
        run: dotnet test backend/RL.API.Tests/RL.API.Tests.csproj --configuration Release

      - name: Publicar cambios exclusivamente en desarrollo
        shell: bash
        run: |
          git config user.name "ChatGPT Technical Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios para publicar."
            exit 0
          fi
          git commit -m "fix(matrices): alinear fase 1 con DDL dinámico definitivo"
          git push origin HEAD:desarrollo

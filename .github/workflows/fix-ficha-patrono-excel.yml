name: Corrección Ficha Patrono Excel

on:
  pull_request:
    branches: [fase-12-mejora-ejecutiva-matrices]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: fix-ficha-patrono-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  corregir-validar-publicar:
    if: github.event.pull_request.head.ref == 'fix-ficha-patrono-excel-20260723'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      REPORTERIA_REGRESION_OUTPUT_DIR: ${{ github.workspace }}/artifacts/reporteria

    steps:
      - name: Checkout rama técnica
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Aplicar corrección de Ficha Patrono
        run: python tools/fix_ficha_patrono_excel.py

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/rl-app/package-lock.json

      - name: Restaurar backend
        run: dotnet restore RIESGO_LAVADO.sln

      - name: Instalar frontend
        working-directory: frontend/rl-app
        run: npm ci

      - name: Instalar Chromium E2E
        working-directory: frontend/rl-app
        run: npx playwright install --with-deps chromium

      - name: Ejecutar Quality Gates
        shell: pwsh
        run: ./tools/run_quality_gates.ps1

      - name: Confirmar archivo real de regresión
        run: |
          test -s artifacts/reporteria/monitoreo_ficha_patrono_corregida.xlsx
          ls -lh artifacts/reporteria/monitoreo_ficha_patrono_corregida.xlsx

      - name: Publicar archivo para revisión visual
        uses: actions/upload-artifact@v4
        with:
          name: ficha-patrono-excel-corregida
          path: artifacts/reporteria/monitoreo_ficha_patrono_corregida.xlsx
          if-no-files-found: error
          retention-days: 14

      - name: Retirar auxiliares temporales
        run: |
          rm -f tools/fix_ficha_patrono_excel.py
          rm -f .github/workflows/fix-ficha-patrono-excel.yml

      - name: Publicar commit limpio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(reporteria): alinea ficha Patrono Excel con PDF"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

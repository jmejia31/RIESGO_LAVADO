name: Phase 4 remove legacy matrices contracts

on:
  push:
    branches:
      - desarrollo

permissions:
  contents: write

jobs:
  apply-phase-4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout desarrollo
        uses: actions/checkout@v4
        with:
          ref: desarrollo
          fetch-depth: 0

      - name: Apply phase 4 cut
        run: python scripts/maintenance/apply_phase4_matrices.py

      - name: Commit phase 4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(matrices): retirar adaptadores y contratos heredados [phase4-done]"
          git push origin HEAD:desarrollo

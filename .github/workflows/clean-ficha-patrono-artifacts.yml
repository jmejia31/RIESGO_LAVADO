name: Limpieza de artefactos Ficha Patrono

on:
  pull_request:
    branches: [fase-12-mejora-ejecutiva-matrices]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  limpiar:
    if: github.event.pull_request.head.ref == 'fix-ficha-patrono-excel-20260723'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rama técnica
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Restaurar artefactos de la rama base
        run: |
          git fetch origin fase-12-mejora-ejecutiva-matrices
          git checkout origin/fase-12-mejora-ejecutiva-matrices -- \
            artifacts/reporteria/monitoreo_detalle_continuacion.pdf \
            artifacts/reporteria/monitoreo_ficha_natural_estandar.xlsx \
            artifacts/reporteria/monitoreo_juridicas_estandar.xlsx
          git rm -f --ignore-unmatch artifacts/reporteria/monitoreo_ficha_patrono_corregida.xlsx
          rm -f .github/workflows/clean-ficha-patrono-artifacts.yml

      - name: Publicar limpieza
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios de limpieza."
            exit 0
          fi
          git commit -m "chore(reporteria): retira artefactos temporales de ficha Patrono"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

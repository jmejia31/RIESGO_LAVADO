name: Fase 12.5.5 Pruebas Evidencia y Cierre

on:
  pull_request:
    branches: [fase-12-mejora-ejecutiva-matrices]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fase12-5-5-cierre
  cancel-in-progress: false

jobs:
  validar-cerrar-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout rama de ejecución
        uses: actions/checkout@v4
        with:
          ref: fase-12-5-5-cierre-ejecucion
          fetch-depth: 0

      - name: Instalar herramientas documentales
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer libreoffice-calc poppler-utils
          python -m pip install --upgrade pip
          python -m pip install python-docx

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/rl-app/package-lock.json

      - name: Restore backend
        run: dotnet restore RIESGO_LAVADO.sln

      - name: Instalar frontend
        working-directory: frontend/rl-app
        run: npm ci

      - name: Instalar Playwright Chromium
        working-directory: frontend/rl-app
        run: npx playwright install --with-deps chromium

      - name: Generar archivos oficiales reales desde backend
        shell: bash
        run: |
          mkdir -p artifacts/reportes
          FASE12_5_5_OUTPUT_DIR="$PWD/artifacts/reportes" \
            dotnet test backend/RL.API.Tests/RL.API.Tests.csproj \
            --configuration Release \
            --no-restore \
            --filter FullyQualifiedName~MatricesRiesgosReportRendererTests \
            --logger "console;verbosity=normal" | tee artifacts/renderer_tests.log
          test -s artifacts/reportes/reporte_ejecutivo_matrices.pdf
          test -s artifacts/reportes/reporte_matrices.xlsx
          test -s artifacts/reportes/ficha_individual_matriz.pdf

      - name: Ejecutar Quality Gates completos
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          ./tools/run_quality_gates.ps1 *> artifacts/fase12_5_5_quality.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compilar Angular para producción
        working-directory: frontend/rl-app
        shell: bash
        run: npm run build 2>&1 | tee ../../artifacts/frontend_build.log

      - name: Consolidar evidencia y Documento Maestro
        shell: bash
        run: |
          python tools/fase12_5_5_cierre.py \
            --quality-log artifacts/fase12_5_5_quality.log \
            --report-dir artifacts/reportes \
            --run-id "${GITHUB_RUN_ID}" | tee artifacts/cierre_script.log

      - name: Renderizar Documento Maestro y archivos oficiales
        shell: bash
        run: |
          DOC_DIR="docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor"
          DOCX="$DOC_DIR/Cierre_Tecnico_Fase_12_Matrices_Riesgos_SGRLA_IHSS.docx"
          mkdir -p artifacts/render_docx artifacts/render_reporte_pdf artifacts/render_ficha_pdf artifacts/render_xlsx

          libreoffice --headless --convert-to pdf --outdir artifacts/render_docx "$DOCX"
          pdftoppm -png -r 150 artifacts/render_docx/Cierre_Tecnico_Fase_12_Matrices_Riesgos_SGRLA_IHSS.pdf artifacts/render_docx/page

          pdftoppm -png -r 150 artifacts/reportes/reporte_ejecutivo_matrices.pdf artifacts/render_reporte_pdf/page
          pdftoppm -png -r 150 artifacts/reportes/ficha_individual_matriz.pdf artifacts/render_ficha_pdf/page

          libreoffice --headless --convert-to pdf --outdir artifacts/render_xlsx artifacts/reportes/reporte_matrices.xlsx
          pdftoppm -png -r 150 artifacts/render_xlsx/reporte_matrices.pdf artifacts/render_xlsx/page

          test "$(find artifacts/render_docx -name 'page-*.png' | wc -l)" -gt 0
          test "$(find artifacts/render_reporte_pdf -name 'page-*.png' | wc -l)" -gt 0
          test "$(find artifacts/render_ficha_pdf -name 'page-*.png' | wc -l)" -gt 0
          test "$(find artifacts/render_xlsx -name 'page-*.png' | wc -l)" -gt 0

      - name: Registrar render visual generado
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor')
          evidence_path = root / 'Evidencia_Fase_12_5_5/fase12_5_5_cierre_definitivo.json'
          data = json.loads(evidence_path.read_text(encoding='utf-8'))
          data['render_visual_generado'] = {
              'documento_maestro_paginas': len(list(Path('artifacts/render_docx').glob('page-*.png'))),
              'reporte_ejecutivo_paginas': len(list(Path('artifacts/render_reporte_pdf').glob('page-*.png'))),
              'ficha_individual_paginas': len(list(Path('artifacts/render_ficha_pdf').glob('page-*.png'))),
              'xlsx_paginas_renderizadas': len(list(Path('artifacts/render_xlsx').glob('page-*.png'))),
              'revision_visual_manual': 'pendiente_revision_asistente'
          }
          data['estado'] = 'cierre_tecnico_generado_pendiente_revision_visual_manual'
          evidence_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Publicar paquete de revisión visual
        uses: actions/upload-artifact@v4
        with:
          name: fase12-5-5-paquete-cierre
          path: |
            artifacts/
            docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor/Cierre_Tecnico_Fase_12_Matrices_Riesgos_SGRLA_IHSS.docx
            docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor/Cierre_Tecnico_Fase_12_Matrices_Riesgos_SGRLA_IHSS.sha256
            docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor/Evidencia_Fase_12_5_5/fase12_5_5_cierre_definitivo.json
            docs/3. Módulo Matrices de Riesgos/Fase 12 - Mejora ejecutiva UXUI y mapa de calor/Fase_12_5_5_Pruebas_Evidencia_y_Cierre_Definitivo.md
          if-no-files-found: error

      - name: Publicar commit limpio en rama funcional
        shell: bash
        run: |
          rm -rf artifacts
          rm -f .github/workflows/fase12-5-5-ejecucion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(matrices): completa cierre técnico fase 12.5.5"
          git pull --rebase origin fase-12-mejora-ejecutiva-matrices
          git push origin HEAD:fase-12-mejora-ejecutiva-matrices

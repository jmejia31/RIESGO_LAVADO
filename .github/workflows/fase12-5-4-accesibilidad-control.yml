name: Fase 12.5.4 Control Accesibilidad

on:
  pull_request:
    branches: [fase-12-mejora-ejecutiva-matrices]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  completar-validar-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout control técnico
        uses: actions/checkout@v4
        with:
          ref: fase-12-5-4-accesibilidad-control
          fetch-depth: 0

      - name: Completar etiquetas accesibles
        run: python tools/fase12_5_4_completar_aria.py

      - name: Verificar controles de reportería
        shell: bash
        run: |
          grep -q 'aria-label="Filtrar reporte por estado"' frontend/rl-app/src/app/features/admin/matrices-riesgos/pages/matrices-riesgos/matrices-riesgos.component.html
          grep -q 'aria-label="Filtrar reporte por tipo de sujeto"' frontend/rl-app/src/app/features/admin/matrices-riesgos/pages/matrices-riesgos/matrices-riesgos.component.html
          grep -q 'aria-label="Filtrar reporte por nivel residual"' frontend/rl-app/src/app/features/admin/matrices-riesgos/pages/matrices-riesgos/matrices-riesgos.component.html
          grep -q 'aria-label="Fecha inicial del reporte"' frontend/rl-app/src/app/features/admin/matrices-riesgos/pages/matrices-riesgos/matrices-riesgos.component.html

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/rl-app/package-lock.json

      - name: Restore backend
        run: dotnet restore RIESGO_LAVADO.sln

      - name: Instalar frontend
        working-directory: frontend/rl-app
        run: npm ci

      - name: Instalar Playwright Chromium
        working-directory: frontend/rl-app
        run: npx playwright install --with-deps chromium

      - name: Ejecutar Quality Gates completos
        shell: pwsh
        run: ./tools/run_quality_gates.ps1

      - name: Publicar commit limpio
        shell: bash
        run: |
          rm -f tools/fase12_5_4_completar_aria.py
          rm -f .github/workflows/fase12-5-4-accesibilidad-control.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(a11y): completa etiquetas de reportería fase 12.5.4"
          git pull --rebase origin fase-12-mejora-ejecutiva-matrices
          git push origin HEAD:fase-12-mejora-ejecutiva-matrices

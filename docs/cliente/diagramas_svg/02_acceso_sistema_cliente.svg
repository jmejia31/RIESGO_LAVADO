<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9aa4b2"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/></filter>
    <style>
      .bg{fill:#07090d}.panel{fill:#0d1117;stroke:#30363d;stroke-width:2;rx:24}.box{fill:#161b22;stroke:#6e7681;stroke-width:2;rx:10;filter:url(#shadow)}.ok{fill:#0f2a1b;stroke:#22c55e;stroke-width:2;rx:10;filter:url(#shadow)}.no{fill:#2a1111;stroke:#ef4444;stroke-width:2;rx:10;filter:url(#shadow)}.decision{fill:#1f2937;stroke:#38bdf8;stroke-width:2;filter:url(#shadow)}.title{fill:#fff;font-family:Segoe UI,Arial,sans-serif;font-size:34px;font-weight:700}.subtitle{fill:#9aa4b2;font-family:Segoe UI,Arial,sans-serif;font-size:18px}.text{fill:#fff;font-family:Segoe UI,Arial,sans-serif;font-size:18px;font-weight:600}.small{fill:#c9d1d9;font-family:Segoe UI,Arial,sans-serif;font-size:14px}.line{stroke:#9aa4b2;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.label{fill:#facc15;font-family:Segoe UI,Arial,sans-serif;font-size:16px;font-weight:700}
    </style>
  </defs>
  <rect class="bg" width="1400" height="900"/><rect class="panel" x="60" y="55" width="1280" height="790"/>
  <text class="title" x="700" y="105" text-anchor="middle">Acceso al sistema y permisos de usuario</text>
  <text class="subtitle" x="700" y="135" text-anchor="middle">El cliente puede entender cómo el sistema permite o bloquea el ingreso</text>

  <rect class="box" x="540" y="180" width="320" height="75"/>
  <text class="text" x="700" y="210" text-anchor="middle">Usuario escribe sus datos</text><text class="small" x="700" y="232" text-anchor="middle">Usuario, correo o contraseña</text>
  <rect class="box" x="540" y="305" width="320" height="75"/>
  <text class="text" x="700" y="335" text-anchor="middle">El sistema valida</text><text class="small" x="700" y="357" text-anchor="middle">Revisa si el acceso es correcto</text>
  <polygon class="decision" points="700,435 850,510 700,585 550,510"/>
  <text class="text" x="700" y="505" text-anchor="middle">¿Acceso</text><text class="text" x="700" y="530" text-anchor="middle">válido?</text>

  <rect class="no" x="160" y="620" width="310" height="85"/>
  <text class="text" x="315" y="652" text-anchor="middle">Acceso rechazado</text><text class="small" x="315" y="676" text-anchor="middle">Se informa al usuario y queda control</text>
  <rect class="ok" x="930" y="620" width="310" height="85"/>
  <text class="text" x="1085" y="652" text-anchor="middle">Ingreso permitido</text><text class="small" x="1085" y="676" text-anchor="middle">Se muestra el menú autorizado</text>
  <rect class="ok" x="930" y="750" width="310" height="60"/>
  <text class="text" x="1085" y="787" text-anchor="middle">Trabaja solo en sus módulos</text>

  <line class="line" x1="700" y1="255" x2="700" y2="305"/><line class="line" x1="700" y1="380" x2="700" y2="435"/>
  <path class="line" d="M550 510 C410 520 315 560 315 620"/><text class="label" x="430" y="500" text-anchor="middle">No</text>
  <path class="line" d="M850 510 C980 520 1085 560 1085 620"/><text class="label" x="965" y="500" text-anchor="middle">Sí</text>
  <line class="line" x1="1085" y1="705" x2="1085" y2="750"/>
</svg>
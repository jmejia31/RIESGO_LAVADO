<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9aa4b2"/></marker>
    <style>
      .bg{fill:#07090d}.panel{fill:#0d1117;stroke:#30363d;stroke-width:2;rx:24}.box{fill:#161b22;stroke:#6e7681;stroke-width:2;rx:10}.blue{fill:#0f2632;stroke:#26a6c9;stroke-width:2;rx:10}.green{fill:#0f2a1b;stroke:#22c55e;stroke-width:2;rx:10}.orange{fill:#2a1f0f;stroke:#f0b429;stroke-width:2;rx:10}.decision{fill:#1f2937;stroke:#38bdf8;stroke-width:2}.title{fill:#fff;font-family:Arial,sans-serif;font-size:34px;font-weight:700}.subtitle{fill:#9aa4b2;font-family:Arial,sans-serif;font-size:18px}.text{fill:#fff;font-family:Arial,sans-serif;font-size:18px;font-weight:600}.small{fill:#c9d1d9;font-family:Arial,sans-serif;font-size:14px}.line{stroke:#9aa4b2;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.label{fill:#facc15;font-family:Arial,sans-serif;font-size:16px;font-weight:700}
    </style>
  </defs>
  <rect class="bg" width="1400" height="900"/><rect class="panel" x="60" y="55" width="1280" height="790"/>
  <text class="title" x="700" y="105" text-anchor="middle">Seguimiento de casos y evidencias</text>
  <text class="subtitle" x="700" y="135" text-anchor="middle">Cada caso puede documentarse con comentarios, documentos y trazabilidad</text>

  <rect class="blue" x="540" y="180" width="320" height="75"/>
  <text class="text" x="700" y="210" text-anchor="middle">Usuario abre el caso</text><text class="small" x="700" y="232" text-anchor="middle">Revisa la información existente</text>
  <rect class="box" x="540" y="300" width="320" height="75"/>
  <text class="text" x="700" y="330" text-anchor="middle">Agrega comentario</text><text class="small" x="700" y="352" text-anchor="middle">Documenta el avance o revisión</text>

  <polygon class="decision" points="700,430 865,505 700,580 535,505"/>
  <text class="text" x="700" y="500" text-anchor="middle">¿Agrega</text><text class="text" x="700" y="525" text-anchor="middle">documento?</text>

  <rect class="orange" x="160" y="650" width="300" height="85"/>
  <text class="text" x="310" y="682" text-anchor="middle">Guarda comentario</text><text class="small" x="310" y="706" text-anchor="middle">Queda registrado en el caso</text>

  <rect class="box" x="550" y="650" width="300" height="85"/>
  <text class="text" x="700" y="682" text-anchor="middle">Sistema revisa documento</text><text class="small" x="700" y="706" text-anchor="middle">Confirma que sea permitido</text>

  <rect class="green" x="940" y="650" width="300" height="85"/>
  <text class="text" x="1090" y="682" text-anchor="middle">Documento guardado</text><text class="small" x="1090" y="706" text-anchor="middle">Queda asociado al caso</text>

  <rect class="blue" x="540" y="785" width="320" height="55"/>
  <text class="text" x="700" y="820" text-anchor="middle">Historial actualizado</text>

  <line class="line" x1="700" y1="255" x2="700" y2="300"/><line class="line" x1="700" y1="375" x2="700" y2="430"/>
  <path class="line" d="M535 505 C410 560 310 585 310 650"/><text class="label" x="415" y="550" text-anchor="middle">No</text>
  <path class="line" d="M700 580 C700 610 700 620 700 650"/><text class="label" x="730" y="615" text-anchor="middle">Sí</text>
  <line class="line" x1="850" y1="692" x2="940" y2="692"/>
  <path class="line" d="M310 735 C310 780 565 770 620 785"/>
  <path class="line" d="M1090 735 C1090 780 835 770 780 785"/>
</svg>
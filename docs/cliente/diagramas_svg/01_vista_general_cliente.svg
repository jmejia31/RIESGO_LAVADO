<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9aa4b2" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      .bg{fill:#07090d;}
      .panel{fill:#0d1117;stroke:#30363d;stroke-width:2;rx:24;}
      .box{fill:#161b22;stroke:#6e7681;stroke-width:2;rx:10;filter:url(#shadow);}
      .box2{fill:#0f2632;stroke:#26a6c9;stroke-width:2;rx:10;filter:url(#shadow);}
      .box3{fill:#2a1f0f;stroke:#f0b429;stroke-width:2;rx:10;filter:url(#shadow);}
      .audit{fill:#261626;stroke:#d946ef;stroke-width:2;rx:10;filter:url(#shadow);}
      .title{fill:#ffffff;font-family:Segoe UI,Arial,sans-serif;font-size:34px;font-weight:700;}
      .subtitle{fill:#9aa4b2;font-family:Segoe UI,Arial,sans-serif;font-size:18px;}
      .text{fill:#ffffff;font-family:Segoe UI,Arial,sans-serif;font-size:18px;font-weight:600;}
      .small{fill:#c9d1d9;font-family:Segoe UI,Arial,sans-serif;font-size:14px;}
      .line{stroke:#9aa4b2;stroke-width:2.2;fill:none;marker-end:url(#arrow);}
    </style>
  </defs>
  <rect class="bg" width="1400" height="900"/>
  <rect class="panel" x="60" y="55" width="1280" height="790"/>
  <text class="title" x="700" y="105" text-anchor="middle">Vista general del Sistema de Gestión de Riesgos LA/FT</text>
  <text class="subtitle" x="700" y="135" text-anchor="middle">Flujo simple para explicar al cliente cómo viaja la información en el sistema</text>

  <rect class="box2" x="545" y="180" width="310" height="75"/>
  <text class="text" x="700" y="210" text-anchor="middle">Usuario autorizado</text>
  <text class="small" x="700" y="232" text-anchor="middle">Ingresa con su rol y permisos</text>

  <rect class="box" x="545" y="305" width="310" height="75"/>
  <text class="text" x="700" y="335" text-anchor="middle">Validación del sistema</text>
  <text class="small" x="700" y="357" text-anchor="middle">Confirma si puede entrar y qué puede ver</text>

  <rect class="box" x="545" y="430" width="310" height="75"/>
  <text class="text" x="700" y="460" text-anchor="middle">Menú de trabajo</text>
  <text class="small" x="700" y="482" text-anchor="middle">Muestra solo los módulos autorizados</text>

  <line class="line" x1="700" y1="255" x2="700" y2="305"/>
  <line class="line" x1="700" y1="380" x2="700" y2="430"/>

  <rect class="box3" x="125" y="590" width="230" height="80"/>
  <text class="text" x="240" y="620" text-anchor="middle">Monitoreo</text>
  <text class="small" x="240" y="643" text-anchor="middle">Revisa coincidencias</text>

  <rect class="box3" x="405" y="590" width="230" height="80"/>
  <text class="text" x="520" y="620" text-anchor="middle">Seguimiento</text>
  <text class="small" x="520" y="643" text-anchor="middle">Documenta casos</text>

  <rect class="box3" x="685" y="590" width="230" height="80"/>
  <text class="text" x="800" y="620" text-anchor="middle">Evidencias</text>
  <text class="small" x="800" y="643" text-anchor="middle">Guarda soportes</text>

  <rect class="box3" x="965" y="590" width="230" height="80"/>
  <text class="text" x="1080" y="620" text-anchor="middle">Reportes</text>
  <text class="small" x="1080" y="643" text-anchor="middle">Consulta y exporta</text>

  <path class="line" d="M700 505 C700 545 240 545 240 590"/>
  <path class="line" d="M700 505 C700 545 520 545 520 590"/>
  <path class="line" d="M700 505 C700 545 800 545 800 590"/>
  <path class="line" d="M700 505 C700 545 1080 545 1080 590"/>

  <rect class="audit" x="480" y="740" width="440" height="70"/>
  <text class="text" x="700" y="768" text-anchor="middle">Auditoría y trazabilidad</text>
  <text class="small" x="700" y="792" text-anchor="middle">Todo lo importante queda registrado: quién, cuándo y qué hizo</text>

  <path class="line" d="M240 670 C240 720 520 710 610 740"/>
  <path class="line" d="M520 670 C520 710 620 710 660 740"/>
  <path class="line" d="M800 670 C800 710 780 710 740 740"/>
  <path class="line" d="M1080 670 C1080 720 880 710 790 740"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <style>
    .bg{fill:#07090d}.panel{fill:#0d1117;stroke:#30363d;stroke-width:2;rx:24}.box{fill:#161b22;stroke:#6e7681;stroke-width:2;rx:10}.title{fill:#fff;font-family:Arial,sans-serif;font-size:36px;font-weight:700}.subtitle{fill:#9aa4b2;font-family:Arial,sans-serif;font-size:18px}.text{fill:#fff;font-family:Arial,sans-serif;font-size:20px;font-weight:700}.small{fill:#c9d1d9;font-family:Arial,sans-serif;font-size:15px}.num{fill:#38bdf8;font-family:Arial,sans-serif;font-size:24px;font-weight:700}
  </style>
  <rect class="bg" width="1400" height="900"/>
  <rect class="panel" x="60" y="55" width="1280" height="790"/>
  <text class="title" x="700" y="110" text-anchor="middle">Índice de diagramas visuales para cliente</text>
  <text class="subtitle" x="700" y="145" text-anchor="middle">Abrir cada archivo SVG para ver el proceso como imagen con cajas y flechas</text>

  <rect class="box" x="150" y="210" width="500" height="90"/>
  <text class="num" x="185" y="245">01</text><text class="text" x="240" y="245">Vista general del sistema</text>
  <text class="small" x="240" y="273">01_vista_general_cliente.svg</text>

  <rect class="box" x="750" y="210" width="500" height="90"/>
  <text class="num" x="785" y="245">02</text><text class="text" x="840" y="245">Acceso al sistema</text>
  <text class="small" x="840" y="273">02_acceso_sistema_cliente.svg</text>

  <rect class="box" x="150" y="350" width="500" height="90"/>
  <text class="num" x="185" y="385">03</text><text class="text" x="240" y="385">Registro de persona o entidad</text>
  <text class="small" x="240" y="413">03_registro_persona_entidad_cliente.svg</text>

  <rect class="box" x="750" y="350" width="500" height="90"/>
  <text class="num" x="785" y="385">04</text><text class="text" x="840" y="385">Revisión de coincidencias</text>
  <text class="small" x="840" y="413">04_revision_coincidencias_cliente.svg</text>

  <rect class="box" x="150" y="490" width="500" height="90"/>
  <text class="num" x="185" y="525">05</text><text class="text" x="240" y="525">Seguimiento y evidencias</text>
  <text class="small" x="240" y="553">05_seguimiento_evidencias_cliente.svg</text>

  <rect class="box" x="750" y="490" width="500" height="90"/>
  <text class="num" x="785" y="525">06</text><text class="text" x="840" y="525">Reportes y auditoría</text>
  <text class="small" x="840" y="553">06_auditoria_reportes_cliente.svg</text>

  <rect class="box" x="270" y="680" width="860" height="90"/>
  <text class="text" x="700" y="715" text-anchor="middle">Ruta en GitHub</text>
  <text class="small" x="700" y="745" text-anchor="middle">docs/cliente/diagramas_svg/</text>
</svg>
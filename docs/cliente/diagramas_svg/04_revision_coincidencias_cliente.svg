<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9aa4b2"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/></filter>
    <style>
      .bg{fill:#07090d}.panel{fill:#0d1117;stroke:#30363d;stroke-width:2;rx:24}.box{fill:#161b22;stroke:#6e7681;stroke-width:2;rx:10;filter:url(#shadow)}.blue{fill:#0f2632;stroke:#26a6c9;stroke-width:2;rx:10;filter:url(#shadow)}.green{fill:#0f2a1b;stroke:#22c55e;stroke-width:2;rx:10;filter:url(#shadow)}.red{fill:#2a1111;stroke:#ef4444;stroke-width:2;rx:10;filter:url(#shadow)}.decision{fill:#1f2937;stroke:#38bdf8;stroke-width:2;filter:url(#shadow)}.title{fill:#fff;font-family:Segoe UI,Arial,sans-serif;font-size:34px;font-weight:700}.subtitle{fill:#9aa4b2;font-family:Segoe UI,Arial,sans-serif;font-size:18px}.text{fill:#fff;font-family:Segoe UI,Arial,sans-serif;font-size:18px;font-weight:600}.small{fill:#c9d1d9;font-family:Segoe UI,Arial,sans-serif;font-size:14px}.line{stroke:#9aa4b2;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.label{fill:#facc15;font-family:Segoe UI,Arial,sans-serif;font-size:16px;font-weight:700}
    </style>
  </defs>
  <rect class="bg" width="1400" height="900"/><rect class="panel" x="60" y="55" width="1280" height="790"/>
  <text class="title" x="700" y="105" text-anchor="middle">Revisión de coincidencias</text>
  <text class="subtitle" x="700" y="135" text-anchor="middle">El sistema muestra posibles coincidencias y el usuario decide si requieren seguimiento</text>

  <rect class="blue" x="145" y="210" width="260" height="75"/>
  <text class="text" x="275" y="240" text-anchor="middle">Usuario consulta</text><text class="small" x="275" y="262" text-anchor="middle">personas o entidades</text>
  <rect class="box" x="470" y="210" width="260" height="75"/>
  <text class="text" x="600" y="240" text-anchor="middle">Sistema muestra</text><text class="small" x="600" y="262" text-anchor="middle">posibles coincidencias</text>
  <rect class="box" x="795" y="210" width="260" height="75"/>
  <text class="text" x="925" y="240" text-anchor="middle">Usuario revisa</text><text class="small" x="925" y="262" text-anchor="middle">detalle y criterio</text>

  <polygon class="decision" points="700,395 875,480 700,565 525,480"/>
  <text class="text" x="700" y="474" text-anchor="middle">¿Requiere</text><text class="text" x="700" y="500" text-anchor="middle">seguimiento?</text>

  <rect class="red" x="230" y="650" width="320" height="85"/>
  <text class="text" x="390" y="682" text-anchor="middle">No requiere seguimiento</text><text class="small" x="390" y="706" text-anchor="middle">Se deja constancia de revisión</text>
  <rect class="green" x="850" y="650" width="320" height="85"/>
  <text class="text" x="1010" y="682" text-anchor="middle">Caso en seguimiento</text><text class="small" x="1010" y="706" text-anchor="middle">Se documenta motivo y evidencia</text>

  <line class="line" x1="405" y1="247" x2="470" y2="247"/><line class="line" x1="730" y1="247" x2="795" y2="247"/>
  <path class="line" d="M925 285 C925 340 700 340 700 395"/>
  <path class="line" d="M525 480 C410 520 390 585 390 650"/><text class="label" x="470" y="525" text-anchor="middle">No</text>
  <path class="line" d="M875 480 C990 520 1010 585 1010 650"/><text class="label" x="930" y="525" text-anchor="middle">Sí</text>
</svg>
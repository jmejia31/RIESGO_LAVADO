<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9aa4b2"/></marker>
    <style>
      .bg{fill:#07090d}.panel{fill:#0d1117;stroke:#30363d;stroke-width:2;rx:24}.box{fill:#161b22;stroke:#6e7681;stroke-width:2;rx:10}.blue{fill:#0f2632;stroke:#26a6c9;stroke-width:2;rx:10}.purple{fill:#261626;stroke:#d946ef;stroke-width:2;rx:10}.green{fill:#0f2a1b;stroke:#22c55e;stroke-width:2;rx:10}.title{fill:#fff;font-family:Arial,sans-serif;font-size:34px;font-weight:700}.subtitle{fill:#9aa4b2;font-family:Arial,sans-serif;font-size:18px}.text{fill:#fff;font-family:Arial,sans-serif;font-size:18px;font-weight:600}.small{fill:#c9d1d9;font-family:Arial,sans-serif;font-size:14px}.line{stroke:#9aa4b2;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1400" height="900"/><rect class="panel" x="60" y="55" width="1280" height="790"/>
  <text class="title" x="700" y="105" text-anchor="middle">Reportes y auditoría del sistema</text>
  <text class="subtitle" x="700" y="135" text-anchor="middle">El sistema permite consultar información y dejar constancia de acciones importantes</text>

  <rect class="blue" x="130" y="240" width="260" height="80"/>
  <text class="text" x="260" y="272" text-anchor="middle">Usuario consulta</text><text class="small" x="260" y="296" text-anchor="middle">casos, listas o resultados</text>
  <rect class="box" x="455" y="240" width="260" height="80"/>
  <text class="text" x="585" y="272" text-anchor="middle">Sistema muestra</text><text class="small" x="585" y="296" text-anchor="middle">información filtrada</text>
  <rect class="green" x="780" y="240" width="260" height="80"/>
  <text class="text" x="910" y="272" text-anchor="middle">Reporte generado</text><text class="small" x="910" y="296" text-anchor="middle">consulta o exportación</text>
  <rect class="purple" x="535" y="470" width="330" height="85"/>
  <text class="text" x="700" y="503" text-anchor="middle">Auditoría automática</text><text class="small" x="700" y="527" text-anchor="middle">registra quién, cuándo y qué hizo</text>

  <rect class="box" x="185" y="670" width="280" height="80"/>
  <text class="text" x="325" y="702" text-anchor="middle">Consulta posterior</text><text class="small" x="325" y="726" text-anchor="middle">para cumplimiento y jefaturas</text>
  <rect class="box" x="560" y="670" width="280" height="80"/>
  <text class="text" x="700" y="702" text-anchor="middle">Revisión de historial</text><text class="small" x="700" y="726" text-anchor="middle">para auditoría interna</text>
  <rect class="box" x="935" y="670" width="280" height="80"/>
  <text class="text" x="1075" y="702" text-anchor="middle">Soporte documental</text><text class="small" x="1075" y="726" text-anchor="middle">para análisis y seguimiento</text>

  <line class="line" x1="390" y1="280" x2="455" y2="280"/>
  <line class="line" x1="715" y1="280" x2="780" y2="280"/>
  <path class="line" d="M910 320 C910 410 700 405 700 470"/>
  <path class="line" d="M700 555 C700 620 325 620 325 670"/>
  <path class="line" d="M700 555 C700 620 700 620 700 670"/>
  <path class="line" d="M700 555 C700 620 1075 620 1075 670"/>
</svg>
<section class="w-full space-y-4" aria-labelledby="titulo-ciclo-integral-matrices">
  <div class="rounded-2xl border border-slate-200 bg-white p-3 shadow-sm">
    <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
      <div>
        <h1 id="titulo-ciclo-integral-matrices" class="text-base font-bold text-slate-900">Ciclo integral del módulo</h1>
        <p class="text-sm text-slate-600">Captura, riesgo maestro, mitigación y seguimiento operativo en un único módulo.</p>
      </div>
      <nav class="flex flex-wrap gap-2" aria-label="Ciclo funcional de Matrices de Riesgos">
        <button type="button" class="rounded-xl px-4 py-2 text-sm font-semibold" [class.bg-slate-900]="vista() === 'matriz'" [class.text-white]="vista() === 'matriz'" (click)="seleccionarVista('matriz')">Matriz y evaluaciones</button>
        <button type="button" class="rounded-xl px-4 py-2 text-sm font-semibold" [class.bg-slate-900]="vista() === 'riesgos'" [class.text-white]="vista() === 'riesgos'" (click)="seleccionarVista('riesgos')">Riesgos</button>
        <button type="button" class="rounded-xl px-4 py-2 text-sm font-semibold" [class.bg-slate-900]="vista() === 'mitigacion'" [class.text-white]="vista() === 'mitigacion'" (click)="seleccionarVista('mitigacion')">Mitigación</button>
        <button type="button" class="rounded-xl px-4 py-2 text-sm font-semibold" [class.bg-slate-900]="vista() === 'monitoreo'" [class.text-white]="vista() === 'monitoreo'" (click)="seleccionarVista('monitoreo')">Monitoreo</button>
      </nav>
    </div>
  </div>

  @if (error()) { <div class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800" role="alert">{{ error() }}</div> }

  @switch (vista()) {
    @case ('riesgos') { <app-matrices-riesgos-gestion /> }
    @case ('mitigacion') { <app-matrices-riesgos-mitigacion [evaluaciones]="evaluaciones()" /> }
    @case ('monitoreo') { <app-matrices-riesgos-monitoreo-operativo [evaluaciones]="evaluaciones()" /> }
    @default { <app-matrices-riesgos /> }
  }
</section>

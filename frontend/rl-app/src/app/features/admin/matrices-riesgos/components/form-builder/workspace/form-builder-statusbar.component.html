<footer class="fbv2-region fbv2-statusbar" data-form-builder-region="statusbar">
  <div class="fbv2-statusbar__content">
    <span class="fbv2-statusbar__version">{{ versionCodigo }}</span>
    <span class="fbv2-statusbar__separator">·</span>
    <span class="fbv2-statusbar__mode"
          [class.fbv2-statusbar__mode--readonly]="soloLectura"
          [class.fbv2-statusbar__mode--draft]="!soloLectura">
      {{ soloLectura ? 'Solo lectura' : 'Modo borrador' }}
    </span>
    <span class="fbv2-statusbar__separator">·</span>
    <span class="fbv2-statusbar__info">{{ seccionesCount }} sección(es)</span>
    <span class="fbv2-statusbar__separator">·</span>
    <span class="fbv2-statusbar__info">{{ catalogosCount }} catálogo(s)</span>
  </div>
</footer>

<header class="fbv2-toolbar bg-white border-b border-gray-200 select-none shadow-xs" data-form-builder-region="toolbar">
  <!-- Fila Superior: Identidad Institucional y Metadatos de Versión -->
  <div class="px-5 py-3 flex items-center justify-between border-b border-gray-100 flex-wrap gap-3">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-ihss-900 text-white flex items-center justify-center font-bold text-sm shadow-sm shrink-0">
        FB
      </div>
      <div>
        <h2 id="titulo-modal-builder" class="text-sm font-bold text-gray-900 flex items-center gap-2">
          {{ title }}
          <span class="rounded-md px-2.5 py-0.5 text-[10px] font-semibold"
                [class.bg-amber-50]="soloLectura"
                [class.text-amber-800]="soloLectura"
                [class.ring-1]="soloLectura"
                [class.ring-amber-600\/20]="soloLectura"
                [class.bg-emerald-50]="!soloLectura"
                [class.text-emerald-700]="!soloLectura"
                [class.ring-1]="!soloLectura"
                [class.ring-emerald-600\/20]="!soloLectura">
            {{ soloLectura ? 'Modo Solo Lectura' : 'Modo Borrador (Edición)' }}
          </span>
        </h2>
        <p class="text-xs text-gray-500">
          Versión {{ versionCodigo }} (v{{ versionNumero }}) · {{ seccionesCount }} sección(es) · {{ catalogosCount }} catálogo(s)
        </p>
      </div>
    </div>

    <!-- Acciones de Cabecera y Cierre -->
    <div class="flex items-center gap-2">
      <button type="button"
              *ngIf="esAdministrador"
              (click)="toggleJson.emit()"
              class="rounded-xl border border-gray-200 bg-white px-3 py-1.5 text-xs font-bold text-gray-700 hover:bg-gray-50 transition-colors flex items-center gap-1.5 shadow-2xs">
        <svg class="w-4 h-4 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
        </svg>
        {{ mostrarJsonAvanzado ? 'Ver Modo Visual' : 'Ver JSON Técnico' }}
      </button>

      <button type="button"
              (click)="cerrar.emit()"
              class="rounded-xl p-1.5 text-gray-400 hover:bg-gray-100 hover:text-gray-600 transition-colors"
              aria-label="Cerrar modal de constructor">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Fila Inferior: Pestañas de Vista y Acciones de Edición -->
  <div class="px-5 py-2 flex items-center justify-between bg-slate-50/70 flex-wrap gap-2">
    <div class="inline-flex rounded-xl bg-slate-200/80 p-1 text-xs font-semibold">
      <button type="button"
              id="tab-vista-secciones"
              (click)="cambiarVista.emit('secciones')"
              [class.bg-white]="vistaActiva === 'secciones' && !mostrarJsonAvanzado"
              [class.text-slate-900]="vistaActiva === 'secciones' && !mostrarJsonAvanzado"
              [class.shadow-2xs]="vistaActiva === 'secciones' && !mostrarJsonAvanzado"
              [class.text-slate-600]="vistaActiva !== 'secciones' || mostrarJsonAvanzado"
              class="rounded-lg px-3 py-1 transition-all flex items-center gap-1.5">
        <svg class="w-4 h-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z" />
        </svg>
        Lienzo de Formulario
      </button>

      <button type="button"
              id="tab-vista-catalogos"
              (click)="cambiarVista.emit('catalogos')"
              [class.bg-white]="vistaActiva === 'catalogos' && !mostrarJsonAvanzado"
              [class.text-slate-900]="vistaActiva === 'catalogos' && !mostrarJsonAvanzado"
              [class.shadow-2xs]="vistaActiva === 'catalogos' && !mostrarJsonAvanzado"
              [class.text-slate-600]="vistaActiva !== 'catalogos' || mostrarJsonAvanzado"
              class="rounded-lg px-3 py-1 transition-all flex items-center gap-1.5">
        <svg class="w-4 h-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
        </svg>
        Catálogos
        <span class="rounded-full bg-slate-200 px-1.5 py-0.2 text-[10px] font-bold text-slate-700">
          {{ catalogosCount }}
        </span>
      </button>
    </div>

    <!-- Botones de Acción Directa -->
    <div *ngIf="!soloLectura" class="flex items-center gap-2">
      <button type="button"
              *ngIf="vistaActiva === 'secciones' && !mostrarJsonAvanzado"
              id="btn-agregar-seccion"
              (click)="agregarSeccion.emit()"
              class="rounded-xl bg-ihss-900 px-3 py-1.5 text-xs font-bold text-white shadow-2xs hover:bg-slate-800 transition-colors flex items-center gap-1">
        + Nueva Sección
      </button>

      <button type="button"
              *ngIf="vistaActiva === 'catalogos' && !mostrarJsonAvanzado"
              id="btn-nuevo-catalogo-header"
              (click)="agregarCatalogo.emit()"
              class="rounded-xl bg-ihss-900 px-3 py-1.5 text-xs font-bold text-white shadow-2xs hover:bg-slate-800 transition-colors flex items-center gap-1">
        + Nuevo Catálogo
      </button>

      <button type="button"
              id="btn-guardar-builder"
              (click)="guardar.emit()"
              class="rounded-xl bg-blue-600 px-3.5 py-1.5 text-xs font-bold text-white shadow-2xs hover:bg-blue-700 transition-colors flex items-center gap-1">
        Guardar Cambios
      </button>
    </div>
  </div>
</header>

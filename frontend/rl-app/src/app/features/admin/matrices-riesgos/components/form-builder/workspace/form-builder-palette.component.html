<aside class="fbv2-region fbv2-palette" data-form-builder-region="palette" aria-label="Biblioteca de controles">
  <div class="p-4 flex flex-col gap-4 h-full overflow-y-auto custom-scrollbar">
    <div>
      <h3 class="text-xs font-bold text-slate-900 uppercase tracking-wider mb-1">Agregar campos</h3>
      <p class="text-[11px] text-slate-500">Haz clic en un control para agregarlo a la sección activa.</p>
    </div>

    <div class="space-y-2">
      @for (ctrl of tiposControles; track ctrl.tipo) {
        <button type="button"
                [disabled]="soloLectura || !seccionActivaId"
                (click)="seccionActivaId && agregarCampo.emit(ctrl)"
                class="w-full text-left p-3 rounded-xl border border-slate-200 hover:border-blue-500 hover:bg-blue-50/50 transition-all duration-200 group disabled:opacity-50 disabled:cursor-not-allowed flex items-start gap-3 shadow-sm hover:shadow-md">
          <div class="w-7 h-7 rounded-lg bg-slate-100 text-slate-700 flex items-center justify-center font-bold text-xs group-hover:bg-blue-600 group-hover:text-white transition-colors flex-shrink-0">
            +
          </div>
          <div class="overflow-hidden">
            <p class="text-xs font-semibold text-slate-800 group-hover:text-blue-900 truncate">{{ ctrl.etiqueta }}</p>
            <p class="text-[10px] text-slate-500 leading-tight line-clamp-2">{{ ctrl.descripcion }}</p>
          </div>
        </button>
      }
    </div>
  </div>
</aside>

<footer class="form-builder-statusbar" data-form-builder-region="statusbar">
  <div class="form-builder-statusbar__content">
    <div class="form-builder-statusbar__state">
      <span class="form-builder-statusbar__indicator" [class.form-builder-statusbar__indicator--readonly]="soloLectura"></span>
      <span class="form-builder-statusbar__mode" [class.form-builder-statusbar__mode--readonly]="soloLectura" [class.form-builder-statusbar__mode--draft]="!soloLectura">{{ soloLectura ? 'Solo lectura' : 'Listo para editar' }}</span>
      <span class="form-builder-statusbar__separator">&middot;</span><span>{{ estadoEtiqueta }}</span>
      <span class="form-builder-statusbar__separator">&middot;</span><span>Versi&oacute;n {{ versionCodigo }}</span>
      <span class="form-builder-statusbar__separator">&middot;</span><span>{{ seccionesCount }} secci&oacute;n(es)</span>
      <span class="form-builder-statusbar__separator">&middot;</span><span>{{ catalogosCount }} cat&aacute;logo(s)</span>
    </div>
    <div class="form-builder-statusbar__actions">
      <button type="button" class="form-builder-statusbar__cancel inline-flex h-8 w-8 items-center justify-center" title="Cancelar cambios" aria-label="Cancelar cambios" (click)="cancelar.emit()">
            <app-action-icon action="close"></app-action-icon>
          </button>
      <button type="button" class="form-builder-statusbar__save inline-flex h-8 w-8 items-center justify-center" title="Guardar cambios" aria-label="Guardar cambios" [disabled]="!puedeGuardar" (click)="guardar.emit()">
            <app-action-icon action="save"></app-action-icon>
          </button>
    </div>
  </div>
</footer>
